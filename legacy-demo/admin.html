        const loadAdminDB = () => {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === 'object') {
                        // Ensure required arrays exist
                        const seed = getInitialSeed();
                        Object.keys(seed).forEach(k => {
                            if (parsed[k] === undefined || parsed[k] === null) parsed[k] = seed[k];
                        });
                        return parsed;
                    }
                }
            } catch (e) { console.error('Error loading DB from localStorage', e); }
            const fresh = getInitialSeed();
            try { localStorage.setItem(DB_KEY, JSON.stringify(fresh)); } catch (e) {}
            return fresh;
        };

        const saveAdminDB = (db) => {
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(db));
                window.dispatchEvent(new Event('storage'));
            } catch (e) {
                console.error('Error saving DB to localStorage', e);
            }
        };

        // Context for Admin State
        const AdminContext = React.createContext();

        /* ============================================================

           (ImgBB-এর মতো হোস্টিং API-তে যায়; DB/UI-তে raw লিংক দেখানো হয় না)
           ============================================================ */
        const MC_AD_IMG_KEYS = ['image', 'src', 'photo', 'thumb', 'thumbnail', 'cover', 'og', 'logo', 'favicon', 'avatar', 'banner', 'poster'];
        const mcIsImageKey = (key) => MC_AD_IMG_KEYS.includes(String(key || '').toLowerCase());
        const mcPickImageFile = (e, setter, toast) => {
            const input = e && e.target ? e.target : null;
            const f = input && input.files ? input.files[0] : null;
            if (input) input.value = '';
            if (!f) return;
            const ext = String(f.name || '').split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'webp'].indexOf(ext) === -1) { toast && toast('শুধু JPG/JPEG/PNG/WEBP ছবি গ্রহণ করা হয়', 'error'); return; }
            if (f.size > 5 * 1024 * 1024) { toast && toast('ছবির সাইজ সর্বোচ্চ ৫ MB', 'error'); return; }
            const reader = new FileReader();
            reader.onload = () => { setter(String(reader.result)); toast && toast('ছবি আপলোড হয়েছে'); };
            reader.onerror = () => toast && toast('ছবি আপলোড করা যায়নি — আবার চেষ্টা করুন', 'error');
            reader.readAsDataURL(f);
        };
        // প্রিভিউ — আপলোডের পর শুধু ছবি দেখা যায়, কোনো লিংক টেক্সট নয়
        const mcImgPreview = (src, cls) => (src
            ? <div className={'overflow-hidden rounded-lg border border-slate-200 bg-slate-50 dark:border-slate-700 dark:bg-slate-800 ' + (cls || '')}><img src={src} alt="" className="max-h-40 w-full object-contain" /></div>
            : null);

        const AdminProvider = ({ children }) => {
            const [db, setDb] = useState(() => loadAdminDB());
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [theme, setTheme] = useState(() => localStorage.theme === 'dark' ? 'dark' : 'light');
            const [toasts, setToasts] = useState([]);
            const [currentUser, setCurrentUser] = useState(() => db.users[0] || { name: 'অ্যাডমিন', role: 'super-admin' });

            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    localStorage.theme = 'dark';
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.theme = 'light';
                }
            }, [theme]);

            const showToast = (message, type = 'success') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3500);
            };

            const mutate = (actionName, moduleName, targetName, callback) => {
                setDb(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    callback(next);
                    // Add to activity log
                    if (!next.activity) next.activity = [];
                    next.activity.unshift({
                        id: 'act_' + Date.now(),
                        user: currentUser.name || 'অ্যাডমিন',
                        action: actionName,
                        module: moduleName,
                        target: targetName,
                        at: new Date().toISOString(),
                        ip: '১৯২.১৬৮.১.১ (ব্রাউজার সেশন)'
                    });
                    if (next.activity.length > 200) next.activity = next.activity.slice(0, 200);
                    saveAdminDB(next);
                    return next;
                });
            };

            return (
                <AdminContext.Provider value={{
                    db, mutate, activeTab, setActiveTab,
                    sidebarOpen, setSidebarOpen,
                    theme, setTheme, toggleTheme: () => setTheme(t => t === 'light' ? 'dark' : 'light'),
                    showToast, toasts, currentUser, setCurrentUser
                }}>
                    {children}
                </AdminContext.Provider>
            );
        };

        // =====================================================================
        // 2. COMMON UI ATOMS (Toast, Modal, ConfirmDialog, StatCard, Badge)
        // =====================================================================
        const ToastContainer = () => {
            const { toasts } = React.useContext(AdminContext);
            if (!toasts.length) return null;
            return (
                <div className="fixed bottom-5 right-5 z-[9999] flex flex-col gap-2 max-w-sm w-full pointer-events-none">
                    {toasts.map(t => (
                        <div key={t.id} className={`pointer-events-auto flex items-center gap-3 p-4 rounded-xl shadow-2xl border text-sm font-semibold transition-all transform animate-fade-in ${
                            t.type === 'success' ? 'bg-emerald-600 text-white border-emerald-500' :
                            t.type === 'error' ? 'bg-rose-600 text-white border-rose-500' :

                            </button>

                        <div className="p-6 overflow-y-auto flex-1">
                            {children}
                        </div>
                    </div>

            );
        };

        const ConfirmModal = ({ isOpen, onClose, onConfirm, title, message, confirmText = 'মুছে ফেলুন', danger = true }) => {

        // =====================================================================
        // 5. MODULE: NEWS MANAGEMENT
        // =====================================================================
        const NewsModule = () => {
            const { db, mutate, showToast } = React.useContext(AdminContext);
            const [filterStatus, setFilterStatus] = useState('all');
            const [filterCategory, setFilterCategory] = useState('all');
            const [search, setSearch] = useState('');
            const [sortBy, setSortBy] = useState('newest');
            const [selectedNewsIds, setSelectedNewsIds] = useState([]);
            const [editingNews, setEditingNews] = useState(null);
            const [isEditorOpen, setIsEditorOpen] = useState(false);
            const [confirmDelete, setConfirmDelete] = useState(null);

            const allNews = db.news || [];

            // Filter & Sort
            const filteredNews = useMemo(() => {
                return allNews.filter(n => {
                    if (filterStatus !== 'all' && n.status !== filterStatus) return false;
                    if (filterCategory !== 'all' && n.categoryId !== filterCategory) return false;
                    if (search.trim()) {
                        const q = search.toLowerCase();
                        const matchTitle = (n.title || '').toLowerCase().includes(q);
                        const matchExcerpt = (n.excerpt || '').toLowerCase().includes(q);
                        const matchTags = (n.tags || []).some(t => t.toLowerCase().includes(q));
                        if (!matchTitle && !matchExcerpt && !matchTags) return false;
                    }
                    return true;
                }).sort((a, b) => {
                    if (sortBy === 'newest') return new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0);
                    if (sortBy === 'oldest') return new Date(a.publishedAt || 0) - new Date(b.publishedAt || 0);
                    if (sortBy === 'views') return (b.views || 0) - (a.views || 0);
                    return 0;
                });
            }, [allNews, filterStatus, filterCategory, search, sortBy]);

            const handleCreateNew = () => {
                setEditingNews({
                    id: 'n_' + Date.now(),
                    slug: '',
                    title: '',
                    excerpt: '',
                    content: '',
                    categoryId: db.categories[0] ? db.categories[0].id : 'mahalchhari',
                    subCategoryId: '',
                    authorId: db.reporters[0] ? db.reporters[0].id : 'r1',
                    image: '',
                    imageCaption: '',
                    imageCredit: '',
                    gallery: [],
                    videoUrl: '',
                    isFeatured: false,
                    isBreaking: false,
                    allowComments: true,
                    publishedAt: new Date().toISOString(),
                    scheduledFor: '',
                    status: 'published',
                    tags: [],
                    seo: { title: '', desc: '', keywords: '' }
                });
                setIsEditorOpen(true);
            };

            const handleEdit = (n) => {
                setEditingNews(JSON.parse(JSON.stringify(n)));
                setIsEditorOpen(true);
            };

            const handleSave = (newsItem) => {
                mutate(editingNews.isNew ? 'create' : 'update', 'news', newsItem.title, (d) => {
                    const idx = d.news.findIndex(x => x.id === newsItem.id);
                    if (idx >= 0) {
                        d.news[idx] = newsItem;
                    } else {
                        d.news.unshift(newsItem);
                    }
                });
                setIsEditorOpen(false);
                showToast(editingNews.isNew ? 'নতুন সংবাদ সফলভাবে যুক্ত হয়েছে!' : 'সংবাদ সফলভাবে আপডেট হয়েছে!');
            };

            const handleTrash = (item) => {
                mutate('trash', 'news', item.title, (d) => {
                    d.news = d.news.filter(x => x.id !== item.id);
                    if (!d.trash) d.trash = [];
                    d.trash.unshift({
                        id: item.id,
                        type: 'news',
                        title: item.title,
                        item: item,
                        trashedAt: new Date().toISOString()
                    });
                });
                showToast('সংবাদটি ট্র্যাশে পাঠানো হয়েছে!');
            };

            const handleBulkTrash = () => {
                if (!selectedNewsIds.length) return;
                mutate('bulk_trash', 'news', `${selectedNewsIds.length} টি সংবাদ`, (d) => {
                    if (!d.trash) d.trash = [];
                    const toTrash = d.news.filter(n => selectedNewsIds.includes(n.id));
                    toTrash.forEach(item => {
                        d.trash.unshift({
                            id: item.id,
                            type: 'news',
                            title: item.title,
                            item: item,
                            trashedAt: new Date().toISOString()
                        });
                    });
                    d.news = d.news.filter(n => !selectedNewsIds.includes(n.id));
                });
                setSelectedNewsIds([]);
                showToast('নির্বাচিত সংবাদসমূহ ট্র্যাশে পাঠানো হয়েছে!');

            const toggleSelectAll = () => {

                    </div>

                    {/* Filter Tabs */}
                    <div className="flex flex-wrap items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
                        {[
                            { id: 'all', label: 'সব', count: allNews.length },
                            { id: 'published', label: 'প্রকাশিত', count: allNews.filter(n => n.status === 'published').length },
                            { id: 'draft', label: 'খসড়া', count: allNews.filter(n => n.status === 'draft').length },
                            { id: 'scheduled', label: 'শিডিউলড', count: allNews.filter(n => n.status === 'scheduled').length },

                                className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${
                                    filterStatus === t.id
                                        ? 'bg-brand-red text-white shadow'
                                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200'
                                }`}
                            >
                                <span>{t.label}</span>
                                <span className="text-[10px] font-mono opacity-80">({mcBn(t.count)})</span>
                            </button>
                        ))}
                    </div>

                    {/* Filter / Search Bar */}
                    <div className="p-4 rounded-2xl bg-white dark:bg-[#1E293B] border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-wrap items-center justify-between gap-3">
                        <div className="flex flex-wrap items-center gap-3 flex-1">
                            {/* Search */}
                            <div className="relative min-w-[200px] flex-1">
                                <i className="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input
                                    type="text"
                                    value={search}
                                    onChange={(e) => setSearch(e.target.value)}

                                    className="w-full pl-9 pr-3 py-1.5 rounded-xl text-xs bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white outline-none focus:border-brand-red"
                                />
                            </div>

                            {/* Category Filter */}
                            <select
                                value={filterCategory}
                                onChange={(e) => setFilterCategory(e.target.value)}

                                <option value="all">সব বিভাগ</option>

                                <option value="newest">নতুন আগে</option>
                                <option value="oldest">পুরোনো আগে</option>

                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">

                                            const cat = (db.categories || []).find(c => c.id === n.categoryId);
                                            const rep = (db.reporters || []).find(r => r.id === n.authorId);
                                            const isSelected = selectedNewsIds.includes(n.id);
                                            return (
                                                <tr key={n.id} className={`hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors ${isSelected ? 'bg-red-50/40 dark:bg-red-950/20' : ''}`}>

                                                        <input
                                                            type="checkbox"
                                                            checked={isSelected}
                                                            onChange={() => toggleSelect(n.id)}
                                                            className="rounded border-slate-300 text-brand-red focus:ring-brand-red cursor-pointer"
                                                        />
                                                    </td>
                                                    <td className="p-3">
                                                        <div className="flex items-center gap-3">
                                                            <div className="h-12 w-16 rounded-lg overflow-hidden bg-slate-200 dark:bg-slate-800 shrink-0">
                                                                <img
                                                                    src={n.image || 'https://images.unsplash.com/photo-1547683905-f686c993aae5?w=200'}
                                                                    alt=""
                                                                    className="h-full w-full object-cover"
                                                                />
                                                            </div>
                                                            <div className="min-w-0 max-w-md">
                                                                <div className="flex items-center gap-1.5 flex-wrap">
                                                                    {n.isBreaking && (
                                                                        <span className="px-1.5 py-0.2 rounded bg-red-600 text-white text-[9px] font-extrabold uppercase animate-pulse">ব্রেকিং</span>

                                                                    {n.isFeatured && (
                                                                        <span className="px-1.5 py-0.2 rounded bg-amber-500 text-white text-[9px] font-extrabold">প্রধান সংবাদ</span>
                                                                    )}
                                                                    <span className="font-serif text-[13px] font-bold text-slate-900 dark:text-white line-clamp-1 hover:text-brand-red cursor-pointer" onClick={() => handleEdit(n)}>
                                                                        {n.title}
                                                                    </span>
                                                                </div>
                                                                <p className="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-1 mt-0.5">{n.excerpt}</p>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td className="p-3">
                                                        <span className="font-bold text-slate-700 dark:text-slate-300">
                                                            {cat ? cat.name : n.categoryId}
                                                        </span>
                                                    </td>
                                                    <td className="p-3 text-slate-500 dark:text-slate-400">
                                                        {rep ? rep.name : '—'}
                                                    </td>
                                                    <td className="p-3 font-mono font-bold text-slate-600 dark:text-slate-300">
                                                        {mcBn((n.views || 0).toLocaleString('bn-BD'))}
                                                    </td>
                                                    <td className="p-3 text-slate-400 text-[11px] whitespace-nowrap">
                                                        {formatBnDate(n.publishedAt)}
                                                    </td>
                                                    <td className="p-3">
                                                        <StatusBadge status={n.status} />
                                                    </td>
                                                    <td className="p-3 text-right">
                                                        <div className="flex items-center justify-end gap-1">
                                                            <a
                                                                href={`index.html#/news/${n.slug || n.id}`}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                className="h-7 w-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-950/50"
                                                                title="পাবলিক প্রিভিউ দেখুন"
                                                            >
                                                                <i className="ph-bold ph-arrow-square-out text-sm"></i>
                                                            </a>
                                                            <button
                                                                onClick={() => handleEdit(n)}
                                                                className="h-7 w-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-950/50"
                                                                title="সম্পাদনা করুন"
                                                            >
                                                                <i className="ph-bold ph-pencil-simple text-sm"></i>
                                                            </button>
                                                            <button
                                                                onClick={() => handleTrash(n)}
                                                                className="h-7 w-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/50"
                                                                title="ট্র্যাশে পাঠান"
                                                            >
                                                                <i className="ph-bold ph-trash text-sm"></i>
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        ) : (
                            <EmptyState
                                icon="ph-newspaper"
                                title="কোনো সংবাদ পাওয়া যায়নি"
                                desc="আপনার অনুসন্ধান অথবা ফিল্টারের সাথে মিলে এমন কোনো সংবাদ পাওয়া যায়নি।"
                            />
                        )}
                    </div>

                    {/* News Editor Modal */}
                    {isEditorOpen && editingNews && (
                        <NewsEditorModal
                            news={editingNews}
                            isOpen={isEditorOpen}
                            onClose={() => setIsEditorOpen(false)}
                            onSave={handleSave}
                        />
                    )}
                </div>
            );
        };

        // Full Featured News Editor Modal
        const NewsEditorModal = ({ news, isOpen, onClose, onSave }) => {
            const { db, showToast } = React.useContext(AdminContext);
            const [form, setForm] = useState(news);
            const [tagInput, setTagInput] = useState((news.tags || []).join(', '));

            // Slug auto generation helper
            const handleTitleChange = (val) => {
                const updated = { ...form, title: val };
                if (!form.slug || form.slug.startsWith('news-') || form.slug.startsWith('n_')) {
                    const s = val.trim().toLowerCase()
                        .replace(/[^\w\u0980-\u09ff\s-]/g, '')
                        .replace(/\s+/g, '-').slice(0, 80);
                    updated.slug = s || 'news-' + Date.now();
                }
                setForm(updated);
            };

            // গ্যালারিতে ছবি শুধু সরাসরি ফাইল আপলোড থেকেই যোগ হয় (কোনো URL নয়)
            const galleryFileRef = React.useRef(null);
            const handleGalleryAdd = (e) => {
                mcPickImageFile(e, (src) => {
                    setForm(prev => ({
                        ...prev,
                        gallery: [...(prev.gallery || []), { src, caption: '' }]
                    }));
                }, showToast);
            };

            const handleGalleryMove = (index, dir) => {
                const list = [...(form.gallery || [])];
                const target = index + dir;
                if (target < 0 || target >= list.length) return;
                const temp = list[index];
                list[index] = list[target];
                list[target] = temp;
                setForm({ ...form, gallery: list });
            };

            const handleGalleryRemove = (index) => {
                setForm(prev => ({
                    ...prev,
                    gallery: prev.gallery.filter((_, i) => i !== index)
                }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const tags = tagInput.split(',').map(t => t.trim()).filter(Boolean);
                onSave({
                    ...form,
                    tags,
                    slug: form.slug || 'news-' + Date.now()
                });
            };

            return (
                <Modal title={form.id.startsWith('n_') ? 'নতুন সংবাদ তৈরি' : 'সংবাদ সম্পাদনা'} isOpen={isOpen} onClose={onClose} maxWidth="max-w-4xl">
                    <form onSubmit={handleSubmit} className="space-y-6 text-xs">
                        <div className="grid grid-cols-1 md:grid-cols-12 gap-5">
                            {/* Main Content (8 cols) */}
                            <div className="md:col-span-8 space-y-4">
                                {/* Title */}
                                <div>
                                    <label className="block font-bold text-slate-800 dark:text-slate-200 mb-1">
                                        সংবাদের শিরোনাম (Title) <span className="text-red-500">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        required
                                        value={form.title}
                                        onChange={(e) => handleTitleChange(e.target.value)}
                                        placeholder="আকর্ষণীয় ও বস্তুনিষ্ঠ শিরোনাম লিখুন..."
                                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-serif text-base font-bold outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red"
                                    />
                                </div>

                                {/* Slug */}
                                <div>
                                    <label className="block font-semibold text-slate-600 dark:text-slate-400 mb-1">
                                        URL স্লাগ (SEO Slug)
                                    </label>
                                    <div className="flex items-center gap-2">
                                        <span className="text-slate-400 font-mono text-[11px]">/news/</span>
                                        <input
                                            type="text"
                                            value={form.slug}
                                            onChange={(e) => setForm({ ...form, slug: e.target.value })}
                                            className="flex-1 px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-700 dark:text-slate-300 font-mono text-xs outline-none"
                                        />
                                    </div>
                                </div>

                                {/* Excerpt */}
                                <div>
                                    <label className="block font-bold text-slate-800 dark:text-slate-200 mb-1">
                                        সংক্ষিপ্ত বিবরণ (Excerpt / Lead Summary)
                                    </label>
                                    <textarea
                                        rows="2"
                                        value={form.excerpt}
                                        onChange={(e) => setForm({ ...form, excerpt: e.target.value })}
                                        placeholder="সংবাদের মূল সারসংক্ষেপ ১-২ বাক্যে লিখুন..."
                                        className="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white outline-none focus:border-brand-red"
                                    ></textarea>
                                </div>

                                {/* Content */}
                                <div>
                                    <label className="block font-bold text-slate-800 dark:text-slate-200 mb-1">
                                        সম্পূর্ণ সংবাদ বিস্তারিত (Full Story Content)
                                    </label>
                                    <textarea
                                        rows="8"
                                        value={form.content}
                                        onChange={(e) => setForm({ ...form, content: e.target.value })}
                                        placeholder="<p>এখানে অনুচ্ছেদ অনুযায়ী বিস্তারিত সংবাদ লিখুন...</p>"
                                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-serif text-sm leading-relaxed outline-none focus:border-brand-red"
                                    ></textarea>
                                </div>

                                {/* Multiple Gallery Images */}
                                <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/40 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <span className="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                                            <i className="ph-bold ph-images text-brand-red"></i>
                                            সংবাদের অতিরিক্ত ফটো গ্যালারি (Multiple Images)
                                        </span>
                                        <span className="flex items-center gap-2">
                                            <button
                                                type="button"
                                                onClick={() => galleryFileRef.current && galleryFileRef.current.click()}
                                                className="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-700 hover:bg-brand-red hover:text-white text-[11px] font-bold transition-colors"
                                            >
                                                + ছবি আপলোড করুন
                                            </button>
                                            <input ref={galleryFileRef} type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={handleGalleryAdd} />
                                        </span>
                                    </div>
                                    {form.gallery && form.gallery.length > 0 ? (
                                        <div className="space-y-2">
                                            {form.gallery.map((g, idx) => (

                                                    <img src={g.src} alt="" className="h-10 w-14 object-cover rounded shrink-0 bg-slate-100" />
                                                    <div className="flex-1 min-w-0">
                                                        <p className="text-[11px] font-semibold text-slate-800 dark:text-slate-200 truncate">{'ছবি ' + (idx + 1)}</p>
                                                        <input
                                                            type="text"
                                                            value={g.caption || ''}
                                                            onChange={(e) => {
                                                                const list = [...form.gallery];
                                                                list[idx].caption = e.target.value;
                                                                setForm({ ...form, gallery: list });
                                                            }}
                                                            placeholder="ক্যাপশন লিখুন..."
                                                            className="w-full text-[10px] text-slate-500 bg-transparent border-0 outline-none p-0 mt-0.5"

                                                    </div>
                                                    <div className="flex items-center gap-1">
                                                        <button type="button" onClick={() => handleGalleryMove(idx, -1)} disabled={idx === 0} className="p-1 text-slate-400 hover:text-slate-700 disabled:opacity-30">

                                                        </button>

                                                            <i className="ph-bold ph-arrow-down"></i>
                                                        </button>
                                                        <button type="button" onClick={() => handleGalleryRemove(idx)} className="p-1 text-red-500 hover:text-red-700">
                                                            <i className="ph-bold ph-trash"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}

                                    ) : (
                                        <p className="text-[11px] text-slate-400 italic">কোনো অতিরিক্ত ছবি যুক্ত নেই।</p>

                                </div>

            const handleCreate = () => {

        const MediaModule = () => {

            const [search, setSearch] = useState('');
            const [selectedFolder, setSelectedFolder] = useState('all');

                const list = [];

                    if (n.image) list.push({ url: n.image, title: n.title, type: 'news', date: n.publishedAt });
                    (n.gallery || []).forEach(g => {
                        if (g.src) list.push({ url: g.src, title: g.caption || n.title, type: 'gallery', date: n.publishedAt });
                    });
                });
                (db.albums || []).forEach(al => {
                    if (al.cover) list.push({ url: al.cover, title: al.title, type: 'album', date: al.createdAt });
                    (al.images || []).forEach(img => {
                        if (img.src) list.push({ url: img.src, title: img.caption || al.title, type: 'album', date: al.createdAt });
                    });
                });
                (db.reporters || []).forEach(r => {
                    if (r.photo) list.push({ url: r.photo, title: r.name, type: 'reporter', date: null });
                });
                return list;
            }, [db]);

                const target = (db.news || [])[0];
                if (!target) { showToast('কোনো সংবাদ পাওয়া যায়নি', 'error'); return; }
                mutate('update', 'news', target.title, (d) => {
                    const x = d.news.find(y => String(y.id) === String(target.id));
                    if (!x) return;
                    x.image = m.url;
                    x.imageCaption = m.title || x.imageCaption;
                });
                showToast('সর্বশেষ সংবাদের প্রধান ছবি ঠিক হয়েছে');
            };

            const filteredMedia = mediaList.filter(m => {
                if (selectedFolder !== 'all' && m.type !== selectedFolder) return false;
                if (search.trim() && !m.title.toLowerCase().includes(search.toLowerCase())) return false;
                return true;

        const CommentsModule = () => {
            const { db, mutate, showToast } = React.useContext(AdminContext);
            const [tab, setTab] = useState('pending');
            const [selectedCommentIds, setSelectedCommentIds] = useState([]);

            const comments = db.comments || [];
            const filteredComments = comments.filter(c => c.status === tab);

            const handleStatusChange = (cid, newStatus) => {
                mutate('status_change', 'comments', 'মন্তব্য #' + cid, (d) => {
                    const c = (d.comments || []).find(x => x.id === cid);
                    if (c) c.status = newStatus;
                });
                showToast(`মন্তব্যটি ${newStatus === 'approved' ? 'অনুমোদন' : newStatus === 'rejected' ? 'বাতিল' : 'স্প্যাম'} করা হয়েছে!`);
            };

            const handleBulkAction = (newStatus) => {
                if (!selectedCommentIds.length) return;
                mutate('bulk_status', 'comments', `${selectedCommentIds.length} টি মন্তব্য`, (d) => {
                    (d.comments || []).forEach(c => {
                        if (selectedCommentIds.includes(c.id)) c.status = newStatus;
                    });
                });
                setSelectedCommentIds([]);
                showToast('নির্বাচিত মন্তব্যসমূহের অবস্থা পরিবর্তন করা হয়েছে!');
            };

            const toggleSelect = (id) => {
                setSelectedCommentIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            };

                                    <select
                                        value={editingUser.role}
                                        onChange={(e) => setEditingUser({ ...editingUser, role: e.target.value })}
                                        className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-bold outline-none"
                                    >
                                        <option value="editor">বার্তা সম্পাদক (Editor)</option>
                                        <option value="reporter">প্রতিবেদক (Reporter)</option>
                                        <option value="moderator">কমেন্ট মডারেটর (Moderator)</option>
                                    </select>
                                </div>
                                <div className="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-700">
                                    <button type="button" onClick={() => setModalOpen(false)} className="px-4 py-2 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700">বাতিল</button>
                                    <button type="submit" className="px-5 py-2 text-xs font-bold text-white rounded-xl bg-brand-red hover:bg-red-700 shadow">সংরক্ষণ করুন</button>
                                </div>
                            </form>
                        </Modal>
                    )}
                </div>
            );
        };

        // =====================================================================
        // 22. MODULE: TRASH BIN & RECOVERY
        // =====================================================================
        const TrashView = () => {
            const { db, mutate, showToast } = React.useContext(AdminContext);
            const trash = db.trash || [];

            const handleRestore = (item) => {
                mutate('restore', 'trash', item.title, (d) => {
                    d.trash = d.trash.filter(x => x.id !== item.id);
                    if (item.type === 'news') {
                        if (!d.news) d.news = [];
                        d.news.unshift(item.item);
                    }
                });
                showToast(`"${item.title}" সফলভাবে পুনঃরুদ্ধার করা হয়েছে!`);
            };

            const handlePermanentDelete = (id, title) => {
                if (!confirm(`"${title}" স্থায়ীভাবে ডিলিট করতে চান? এটি আর ফিরিয়ে আনা যাবে না!`)) return;
                mutate('permanent_delete', 'trash', title, (d) => {
                    d.trash = d.trash.filter(x => x.id !== id);
                });
                showToast('স্থায়ীভাবে মুছে ফেলা হয়েছে!');
            };

            const handleEmptyTrash = () => {
                if (!confirm('ট্র্যাশ বিনের সবকিছু কি স্থায়ীভাবে মুছে ফেলতে চান?')) return;
                mutate('empty_trash', 'trash', 'সম্পূর্ণ ট্র্যাশ বিন', (d) => {
                    d.trash = [];
                });
                showToast('ট্র্যাশ বিন খালি করা হয়েছে!');
            };

            return (
                <div className="space-y-6 animate-fade-in max-w-4xl">
                    <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800">
                        <div>
                            <h2 className="font-serif text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                <span className="h-6 w-1.5 rounded-full bg-brand-red"></span>
                                <span>ট্র্যাশ বিন ও রিকভারি (Trash Recovery)</span>
                            </h2>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">মুছে ফেলা সংবাদ বা আইটেম পুনঃরুদ্ধার অথবা স্থায়ীভাবে পরিষ্কার করুন</p>
                        </div>
                        {trash.length > 0 && (
                            <button
                                onClick={handleEmptyTrash}
                                className="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold transition-all shadow flex items-center gap-1.5"
                            >
                                <i className="ph-bold ph-trash"></i>
                                <span>ট্র্যাশ বিন সম্পূর্ণ খালি করুন</span>
                            </button>
                        )}
                    </div>

                    <div className="rounded-2xl bg-white dark:bg-[#1E293B] border border-slate-200/80 dark:border-slate-800 shadow-sm p-5 space-y-3">
                        {trash.length > 0 ? (
                            trash.map(t => (
                                <div key={t.id} className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 flex items-center justify-between gap-4">
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300">
                                                {t.type === 'news' ? 'সংবাদ' : 'আইটেম'}
                                            </span>
                                            <span className="text-[11px] text-slate-400 font-mono">মুছে ফেলা হয়েছে: {timeAgoBn(t.trashedAt)}</span>
                                        </div>
                                        <h4 className="font-serif text-sm font-bold text-slate-900 dark:text-white mt-1">{t.title}</h4>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button
                                            onClick={() => handleRestore(t)}
                                            className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1 transition-colors"
                                        >
                                            <i className="ph-bold ph-arrows-clockwise"></i>
                                            <span>রিস্টোর</span>
                                        </button>
                                        <button
                                            onClick={() => handlePermanentDelete(t.id, t.title)}
                                            className="px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-red-50 text-red-600 text-xs font-bold transition-colors"
                                        >
                                            স্থায়ী মুছুন
                                        </button>
                                    </div>
                                </div>
                            ))
                        ) : (
                            <EmptyState icon="ph-trash" title="ট্র্যাশ বিন খালি" desc="বর্তমানে কোনো মুছে ফেলা সংবাদ বা ফাইল ট্র্যাশে জমা নেই।" />
                        )}
                    </div>
                </div>
            );
        };

        // =====================================================================
        // 23. MODULE: ACTIVITY LOG
        // =====================================================================
        const ActivityView = () => {
            const { db, mutate, showToast } = React.useContext(AdminContext);
            const logs = db.activity || [];

            const handleClear = () => {
                if (!confirm('অ্যাক্টিভিটি হিস্টোরি সম্পূর্ণ মুছে ফেলতে চান?')) return;
                mutate('clear', 'activity', 'লগ ফাইল', (d) => {
                    d.activity = [];
                });
                showToast('অ্যাক্টিভিটি লগ মুছে ফেলা হয়েছে!');
            };

            return (
                <div className="space-y-6 animate-fade-in max-w-4xl">
                    <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800">
                        <div>
                            <h2 className="font-serif text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                <span className="h-6 w-1.5 rounded-full bg-brand-red"></span>
                                <span>অ্যাক্টিভিটি লগ ও অডিট হিস্টোরি (Activity Log)</span>
                            </h2>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">কখন কোন ইউজার কী সংবাদ যোগ, পরিবর্তন বা মুছেছেন তার বিস্তারিত বিবরণ</p>
                        </div>
                        {logs.length > 0 && (
                            <button
                                onClick={handleClear}
                                className="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-red-50 text-red-600 text-xs font-bold transition-colors"
                            >
                                লগ ক্লিয়ার করুন
                            </button>
                        )}
                    </div>

                    <div className="rounded-2xl bg-white dark:bg-[#1E293B] border border-slate-200/80 dark:border-slate-800 shadow-sm p-5 space-y-3">
                        {logs.length > 0 ? (
                            logs.map(log => (
                                <div key={log.id} className="p-3.5 rounded-xl border border-slate-100 dark:border-slate-800/80 bg-slate-50/60 dark:bg-slate-800/40 flex items-start justify-between gap-3 text-xs">
                                    <div className="flex items-start gap-3">
                                        <div className="h-8 w-8 rounded-xl bg-slate-200 dark:bg-slate-700 flex items-center justify-center font-bold text-slate-700 dark:text-slate-300 shrink-0">
                                            {log.user ? log.user.slice(0, 1) : 'অ'}
                                        </div>
                                        <div>
                                            <p className="font-bold text-slate-900 dark:text-white">
                                                <span>{log.user}</span>
                                                <span className="text-slate-400 font-normal"> — </span>
                                                <span className="text-brand-red font-semibold">{log.action}</span>
                                                <span className="text-slate-500 dark:text-slate-400"> ({log.module}): </span>
                                                <span className="italic font-medium">"{log.target}"</span>
                                            </p>
                                            <p className="text-[11px] text-slate-400 mt-0.5 font-mono">{log.ip}</p>
                                        </div>
                                    </div>
                                    <span className="text-[11px] text-slate-400 whitespace-nowrap font-mono">{timeAgoBn(log.at)}</span>
                                </div>
                            ))
                        ) : (
                            <EmptyState icon="ph-clock-counter-clockwise" title="কোনো অ্যাক্টিভিটি নেই" desc="এখনও কোনো কার্যক্রম রেকর্ড করা হয়নি।" />
                        )}
                    </div>
                </div>
            );
        };

        // =====================================================================
        // 24. ROOT APP COMPONENT
        // =====================================================================
        const AdminApp = () => {
            const { activeTab } = React.useContext(AdminContext);

            const renderModule = () => {
                switch (activeTab) {
                    case 'dashboard': return <DashboardView />;
                    case 'news': return <NewsModule />;
                    case 'reports': return <ReportsModule />;
                    case 'categories': return <CategoriesModule />;
                    case 'reporters': return <ReportersModule />;
                    case 'media': return <MediaModule />;
                    case 'videos': return <VideosModule />;
                    case 'announcements': return <AnnouncementsModule />;
                    case 'breaking': return <BreakingModule />;
                    case 'comments': return <CommentsModule />;
                    case 'ads': return <AdsModule />;
                    case 'albums': return <AlbumsModule />;
                    case 'homepage': return <HomepageControlView />;
                    case 'menus': return <MenusModule />;
                    case 'pages': return <PagesModule />;
                    case 'settings': return <SettingsView />;
                    case 'seo': return <SeoView />;
                    case 'users': return <UsersModule />;
                    case 'trash': return <TrashView />;
                    case 'activity': return <ActivityView />;
                    default: return <DashboardView />;
                }
            };

            return (
                <div className="min-h-full flex flex-col bg-slate-50 dark:bg-[#0B1120]">
                    <Sidebar />
                    <div className="lg:pl-64 flex flex-col flex-1">
                        <Topbar />
                        <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
                            {renderModule()}
                        </main>
                        <footer className="py-4 px-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400 bg-white dark:bg-[#0F172A]">
                            দৈনিক মহালছড়ি নিউজ — অ্যাডমিন ম্যানেজমেন্ট কনসোল | &copy; ২০২৬
                        </footer>
                    </div>
                    <ToastContainer />
                </div>
            );
        };

        // Render application
        const root = ReactDOM.createRoot(document.getElementById('admin-root'));
        root.render(
            <AdminProvider>
                <AdminApp />
            </AdminProvider>
        );
    </script>
</body>
</html>
