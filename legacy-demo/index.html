                                    ))}
                                </div>
                                <div className="mt-5 flex flex-wrap items-center justify-end gap-2 border-t border-gray-200 pt-4 dark:border-gray-700">
                                    <span className="mr-auto text-[11px] text-gray-500">সংরক্ষণ করলেই ডেমো ডেটাবেজে লেখা হয় ও অ্যাক্টিভিটি লগে জমা হয়।</span>
                                    <button type="button" onClick={() => setEditing(null)} className="rounded-lg border border-gray-300 px-4 py-2 text-sm font-bold text-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300">বাতিল</button>
                                    <button type="submit" className="rounded-lg bg-[#1F7A3D] px-5 py-2 text-sm font-bold text-white hover:bg-[#166033]">সংরক্ষণ</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        // ==================================================================
        //  HTML ⇄ ব্লক (কনটেন্ট এডিটর)
        // ==================================================================
        const mcHtmlToBlocks = (html) => {
            if (typeof DOMParser === 'undefined') return [{ t: 'p', v: String(html || '') }];
            const doc = new DOMParser().parseFromString('<div id="mcroot">' + (html || '') + '</div>', 'text/html');
            const kids = Array.from(doc.getElementById('mcroot').children);
            if (!kids.length) return [{ t: 'p', v: String(html || '') }];
            return kids.map(el => {
                if (el.tagName === 'UL' || el.tagName === 'OL') return { t: 'ul', v: Array.from(el.children).map(li => li.textContent).join('\n') };
                if (el.tagName === 'TABLE') return { t: 'table', v: Array.from(el.querySelectorAll('tr')).map(tr => Array.from(tr.children).map(td => td.textContent.trim()).join(' | ')).join('\n') };
                if (el.tagName === 'IMG') return { t: 'img', v: el.getAttribute('src') || '', caption: el.getAttribute('alt') || '' };
                return { t: ({ 'H2': 'h2', 'H3': 'h2', 'BLOCKQUOTE': 'quote' })[el.tagName] || 'p', v: el.innerHTML };
            });
        };
        const mcBlocksToHtml = (blocks) => (blocks || []).map(b => {
            if (b.t === 'h2') return `<h2>${b.v}</h2>`;
            if (b.t === 'quote') return `<blockquote>${b.v}</blockquote>`;
            if (b.t === 'important') return `<p class="text-lg font-bold">${b.v}</p>`;
            if (b.t === 'ul') return `<ul>${String(b.v || '').split('\n').filter(Boolean).map(li => `<li>${li}</li>`).join('')}</ul>`;
            if (b.t === 'img') return `<figure><img src="${b.v}" alt="${b.caption || ''}" /><figcaption>${b.caption || ''}</figcaption></figure>`;
            if (b.t === 'table') return `<table><tbody>${String(b.v || '').split('\n').filter(Boolean).map(r => `<tr>${r.split('|').map(c => `<td>${c.trim()}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
            return `<p>${b.v}</p>`;
        }).join('');

        // ==================================================================
        //  সংবাদ তালিকা (১৩) — ফিল্টার, বাল্ক, কুইক অ্যাকশন
        // ==================================================================
        const MC_STATUS_TONE = { published: 'green', draft: 'gray', pending: 'amber', scheduled: 'blue', archived: 'violet', trash: 'red' };

        const McAdminNewsList = () => {
            const { navigate } = React.useContext(AppContext);
            const db = useMcStore();
            const [q, setQ] = React.useState('');
            const [st, setSt] = React.useState('all');
            const [cat, setCat] = React.useState('all');
            const [sel, setSel] = React.useState([]);
            let rows = [...db.news];
            if (q) rows = rows.filter(n => (n.title + ' ' + (n.excerpt || '')).toLowerCase().includes(q.toLowerCase()));
            if (st !== 'all') rows = rows.filter(n => (n.status || 'published') === st);
            if (cat !== 'all') rows = rows.filter(n => n.categoryId === cat);
            rows.sort((a, b) => new Date(b.publishedAt || b.createdAt) - new Date(a.publishedAt || a.createdAt));
            const all = rows.map(r => r.id);
            const dup = (n) => { MC_STORE.mutate('create:news:' + n.title + ' (নকল)', (d) => { const c = JSON.parse(JSON.stringify(n)); c.id = mcUid('n'); c.title = c.title + ' (নকল)'; c.slug = c.slug + '-copy-' + Math.floor(Math.random() * 900 + 100); c.status = 'draft'; c.publishedAt = mcNowISO(); c.views = 0; c.demo = true; d.news.unshift(c); }); mcToast('নকল তৈরি হয়েছে — খসড়া তালিকায় দেখুন'); };
            const setStatus = (ids, status) => { MC_STORE.mutate('update:news:' + ids.length + ' টি → ' + status, (d) => { d.news.forEach(n => { if (ids.includes(n.id)) { n.status = status; n.updatedAt = mcNowISO(); if (status === 'published' && !n.publishedAt) n.publishedAt = mcNowISO(); } }); }); setSel([]); mcToast(mcBn(ids.length) + ' টি “' + (api.getSettings().statuses[status] || status) + '” করা হয়েছে'); };
            const toggle = (k, v) => MC_STORE.mutate('update:news:' + k, (d) => { const n = d.news.find(x => String(x.id) === String(v)); if (n) n[k] = !n[k]; });
            const cols = [
                { key: 'title', label: 'শিরোনাম', render: (n) => (
                    <div className="flex items-start gap-3">
                        <input type="checkbox" checked={sel.includes(n.id)} onChange={() => setSel(s => s.includes(n.id) ? s.filter(x => x !== n.id) : [...s, n.id])} className="mt-1 h-4 w-4 rounded border-gray-300 text-brand-red" />
                        {n.image ? <img src={n.image} alt="" onError={imgFallback} className="h-11 w-16 shrink-0 rounded object-cover" /> : null}
                        <div className="min-w-0">
                            <button onClick={() => navigate('/admin/news/' + n.id)} className="block text-left font-semibold text-gray-900 hover:text-brand-red dark:text-white line-clamp-1">{n.title}</button>
                            <span className="flex flex-wrap items-center gap-1.5 text-[11px] text-gray-500">
                                <span className="font-mono">/{n.slug}</span>{n.isFeatured && <McTag tone="amber"><i className="ph ph-star"></i></McTag>}{n.breaking && n.breaking.on && <McTag tone="red">ব্রেকিং</McTag>}{n.demo && <McTag tone="blue">ডেমো</McTag>}
                            </span>
                        </div>
                    </div>
                ) },
                { key: 'categoryId', label: 'বিভাগ', render: (n) => <span className="whitespace-nowrap">{api.getCategory(n.categoryId).name}</span> },
                { key: 'status', label: 'অবস্থা', render: (n) => <McTag tone={MC_STATUS_TONE[n.status || 'published'] || 'gray'}>{(api.getSettings().statuses || {})[n.status || 'published'] || n.status}</McTag> },
                { key: 'publishedAt', label: 'প্রকাশ', render: (n) => <span className="whitespace-nowrap text-[12px]">{n.publishedAt ? formatBanglaDate(n.publishedAt) : '—'}{n.status === 'scheduled' && n.scheduledFor ? <><br />স্থগিত: {formatBanglaDate(n.scheduledFor)}</> : null}</span> },
                { key: 'views', label: 'পঠন', render: (n) => (
                        <span className="flex items-center gap-1.5 whitespace-nowrap">
                            {mcBn((n.views || 0).toLocaleString('bn-BD'))}
                            <button type="button" title="ভিউ রিসেট (১৬ নম্বর)" aria-label="ভিউ রিসেট" onClick={() => { MC_STORE.mutate('update:news:views-reset', (d) => { const x = d.news.find(y => String(y.id) === String(n.id)); x.views = 0; }); mcToast('পঠনসংখ্যা শূন্য করা হয়েছে'); }} className="text-gray-400 hover:text-brand-red"><i className="ph ph-arrows-counter-clockwise"></i></button>
                        </span>) },
            ];
            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-end justify-between gap-3">
                        <div>
                            <h2 className="font-serif text-2xl font-bold text-gray-900 dark:text-white">সংবাদ ব্যবস্থাপনা</h2>
                            <p className="text-xs text-gray-500">{mcBn(db.news.length)} টি আইটেম · খসড়া, শিডিউল, প্রকাশ, আর্কাইভ, ট্র্যাশ — এক জায়গায়</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            <div className="relative"><i className="ph ph-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400"></i><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="শিরোনাম খুঁজুন…" className="w-48 rounded-lg border border-gray-300 bg-white py-1.5 pl-8 pr-2 text-sm dark:border-gray-600 dark:bg-gray-900 dark:text-white" /></div>
                            <select value={st} onChange={(e) => setSt(e.target.value)} className="rounded-lg border border-gray-300 bg-white px-2 py-1.5 text-sm dark:border-gray-600 dark:bg-gray-900 dark:text-white"><option value="all">সব অবস্থা</option>{Object.keys(api.getSettings().statuses || {}).map(k => <option key={k} value={k}>{api.getSettings().statuses[k]}</option>)}</select>
                            <select value={cat} onChange={(e) => setCat(e.target.value)} className="rounded-lg border border-gray-300 bg-white px-2 py-1.5 text-sm dark:border-gray-600 dark:bg-gray-900 dark:text-white"><option value="all">সব বিভাগ</option>{db.categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select>
                            <button onClick={() => navigate('/admin/news/new')} className="flex items-center gap-1.5 rounded-lg bg-brand-red px-3.5 py-2 text-sm font-bold text-white hover:bg-red-700"><i className="ph ph-plus"></i> নতুন সংবাদ</button>
                        </div>
                    </div>

                    {sel.length > 0 && (
                        <div className="flex flex-wrap items-center gap-2 rounded-lg border border-brand-red/40 bg-red-50 px-3 py-2 text-xs dark:bg-red-900/20">
                            <b className="text-gray-800 dark:text-gray-100">{mcBn(sel.length)} টি নির্বাচিত</b>
                            {['published', 'draft', 'pending', 'archived'].map(s => <button key={s} onClick={() => setStatus(sel, s)} className="rounded border border-gray-300 bg-white px-2 py-1 font-semibold hover:border-brand-red dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200">{api.getSettings().statuses[s]}</button>)}
                            <button onClick={() => setStatus(all, 'trash')} className="ml-auto rounded border border-gray-300 px-2 py-1 font-semibold text-brand-red">সব ট্র্যাশে</button>
                        </div>
                    )}

                    <div className="overflow-x-auto rounded-lg border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800">
                        <table className="min-w-full text-sm">
                            <thead className="bg-gray-50 text-left text-[11px] uppercase tracking-wider text-gray-500 dark:bg-gray-900/40">
                                <tr>
                                    <th className="w-8 px-3 py-2.5"><input type="checkbox" aria-label="সব নির্বাচন" checked={!!all.length && sel.length === all.length} onChange={() => setSel(sel.length === all.length ? [] : all)} className="h-4 w-4 rounded border-gray-300 text-brand-red" /></th>
                                    {cols.map(c => <th key={c.key} className="px-3 py-2.5 font-bold whitespace-nowrap">{c.label}</th>)}
                                    <th className="px-3 py-2.5 text-right font-bold">অ্যাকশন</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                                {rows.map(n => (
                                    <tr key={n.id} className="hover:bg-gray-50 dark:hover:bg-gray-700/40">
                                        <td className="px-3 py-2.5" />
                                        {cols.map(c => <td key={c.key} className="px-3 py-2.5 align-top">{c.render(n)}</td>)}
                                        <td className="px-3 py-2.5 text-right whitespace-nowrap">
                                            <span className="inline-flex gap-1.5">
                                                <button className={MC_ICON_BTN} title="সম্পাদনা" aria-label="সম্পাদনা" onClick={() => navigate('/admin/news/' + n.id)}><i className="ph ph-pencil-simple"></i></button>
                                                <button className={MC_ICON_BTN} title="প্রিভিউ" aria-label="প্রিভিউ" onClick={() => navigate('/article', { id: n.id })}><i className="ph ph-eye"></i></button>
                                                <button className={`${MC_ICON_BTN} ${n.isFeatured ? '!border-amber-400 !text-amber-500' : ''}`} title="ফিচার্ড টগল" aria-label="ফিচার্ড" onClick={() => toggle('isFeatured', n.id)}><i className="ph ph-star"></i></button>
                                                <button className={`${MC_ICON_BTN} ${n.breaking && n.breaking.on ? '!border-brand-red !text-brand-red' : ''}`} title="ব্রেকিং টগল" aria-label="ব্রেকিং" onClick={() => { const on = !(n.breaking && n.breaking.on); MC_STORE.mutate('update:news:breaking', (d) => { const x = d.news.find(y => String(y.id) === String(n.id)); x.breaking = { on, startAt: on ? mcNowISO() : null, endAt: on ? new Date(Date.now() + 3600000).toISOString() : null }; }); }}>
                                                    <i className="ph ph-lightning"></i></button>
                                                <button className={MC_ICON_BTN} title="নকল তৈরি" aria-label="নকল" onClick={() => dup(n)}><i className="ph ph-copy"></i></button>
                                                <button className={MC_ICON_BTN} title="সাইট থেকে লুকান (আর্কাইভ)" aria-label="লুকান" onClick={() => setStatus([n.id], 'archived')}><i className="ph ph-eye-slash"></i></button>
                                                <button className={MC_ICON_BTN} title="ট্র্যাশ" aria-label="ট্র্যাশ" onClick={() => { MC_STORE.mutate('update:news:trash', (d) => { const x = d.news.find(y => String(y.id) === String(n.id)); x.prevStatus = x.status; x.status = 'trash'; x.trashedAt = mcNowISO(); }); mcToast('সংবাদটি রিসাইকল বিনে গেছে'); }}><i className="ph ph-trash-simple"></i></button>
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                                {!rows.length && <tr><td colSpan={cols.length + 2} className="px-3 py-10 text-center text-sm text-gray-500">কোনো সংবাদ পাওয়া যায়নি।</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // ==================================================================
        //  সংবাদ এডিটর (১৩.১) — ব্লক এডিটর, গ্যালারি, শিডিউল, SEO, রিভিশন
        // ==================================================================
        const MC_BLOCK_TYPES = [
            { v: 'p', l: 'অনুচ্ছেদ', icon: 'ph-text-paragraph' },
            { v: 'h2', l: 'শিরোনাম', icon: 'ph-text-h' },
            { v: 'quote', l: 'উদ্ধৃতি', icon: 'ph-quotes' },
            { v: 'important', l: 'গুরুত্বপূর্ণ', icon: 'ph-lightbulb' },
            { v: 'ul', l: 'তালিকা', icon: 'ph-list-numbers' },
            { v: 'img', l: 'ছবি', icon: 'ph-image' },
            { v: 'table', l: 'টেবিল', icon: 'ph-table' },
        ];

        const McAdminNewsEditor = ({ id }) => {
            const { navigate, user } = React.useContext(AppContext);
            const db = useMcStore();
            const isNew = !id || id === 'new';
            const src = isNew ? null : db.news.find(n => String(n.id) === String(id));
            const [d, setD] = React.useState(() => src ? { ...src, blocks: src.blocks && src.blocks.length ? src.blocks : mcHtmlToBlocks(src.content), gallery: src.gallery || [] }
                : { title: '', slug: '', categoryId: db.categories[0].id, subCategoryId: '', excerpt: '', content: '', blocks: [{ t: 'p', v: '' }], gallery: [], tags: [], status: 'draft', isFeatured: false, breaking: { on: false, startAt: null, endAt: null }, allowComments: true, seo: {}, authorId: (MOCK_USERS.reporters[0] || {}).id, image: '', imageCaption: '', imageCredit: '', videoUrl: '' });
            const [tagText, setTagText] = React.useState((d.tags || []).join(', '));
            const [savedAt, setSavedAt] = React.useState(null);
            React.useEffect(() => { if (!src && !isNew) navigate('/admin/news'); }, [src, isNew]);
            React.useEffect(() => { setD(p => ({ ...p, tags: tagText.split(',').map(t => t.trim()).filter(Boolean) })); }, [tagText]);

            const set = (k, v) => setD(p => ({ ...p, [k]: v }));
            const patch = (o) => setD(p => ({ ...p, ...o }));
            const setBlock = (i, o) => setD(p => { const b = [...p.blocks]; b[i] = { ...b[i], ...o }; return { ...p, blocks: b }; });
            const moveBlock = (i, dir) => setD(p => { const b = [...p.blocks]; const j = i + dir; if (j < 0 || j >= b.length) return p; [b[i], b[j]] = [b[j], b[i]]; return { ...p, blocks: b }; });
            const delBlock = (i) => setD(p => ({ ...p, blocks: p.blocks.filter((_, j) => j !== i) }));
            const addBlock = (t) => setD(p => ({ ...p, blocks: [...p.blocks, { t, v: t === 'img' ? '' : '', caption: '' }] }));
            const moveImg = (i, dir) => setD(p => { const g = [...(p.gallery || [])]; const j = i + dir; if (j < 0 || j >= g.length) return p; [g[i], g[j]] = [g[j], g[i]]; return { ...p, gallery: g }; });
            const dragFrom = React.useRef(null);
            const dropImg = (to) => { const from = dragFrom.current; dragFrom.current = null; if (from === null || from === to) return; setD(p => { const g = [...(p.gallery || [])]; const [m] = g.splice(from, 1); g.splice(to, 0, m); return { ...p, gallery: g }; }); mcToast('ছবির ক্রম বদলেছে (ড্র্যাগ অ্যান্ড ড্রপ)'); };
            // ১১ নম্বর: প্রকাশের তারিখ + সময় আলাদা করে সেট
            const pYmd = () => String(d.publishedAt || '').slice(0, 10);
            const pHm = () => String(d.publishedAt || '').slice(11, 16);
            const setPublishPart = (which, val) => {
                const base = d.publishedAt ? new Date(d.publishedAt) : new Date();
                const y = which === 'date' ? String(val).slice(0, 4) : base.getFullYear();
                const mo = which === 'date' ? String(val).slice(5, 7) : String(base.getMonth() + 1).padStart(2, '0');
                const da = which === 'date' ? String(val).slice(8, 10) : String(base.getDate()).padStart(2, '0');
                const hh = which === 'time' ? String(val).slice(0, 2) : String(base.getHours()).padStart(2, '0');
                const mi = which === 'time' ? String(val).slice(3, 5) : String(base.getMinutes()).padStart(2, '0');
                set('publishedAt', y + '-' + mo + '-' + da + 'T' + hh + ':' + mi + ':00');
            };

            const doSave = (extra) => {
                const content = mcBlocksToHtml(d.blocks || []);
                const payload = { ...d, ...extra, content, updatedAt: mcNowISO() };
                if (payload.status === 'scheduled') { payload.publishedAt = payload.publishedAt || payload.scheduledFor || mcNowISO(); }
                if (extra && extra.status === 'published' && !payload.publishedAt) payload.publishedAt = mcNowISO();
                if (!payload.slug) payload.slug = mcSlug(payload.title || 'news') + '-' + Math.floor(Math.random() * 900 + 100);
                MC_STORE.mutate(`${isNew ? 'create' : 'update'}:news:${payload.title || 'শিরোনামহীন'}`, (dd) => {
                    if (isNew) { payload.id = mcUid('n'); payload.createdAt = mcNowISO(); payload.views = 0; payload.demo = true; dd.news.unshift(payload); }
                    else {
                        const i = dd.news.findIndex(n => String(n.id) === String(id));
                        if (i > -1) {
                            const old = dd.news[i];
                            dd.revisions = dd.revisions || [];
                            dd.revisions.unshift({ id: mcUid('r'), newsId: old.id, at: mcNowISO(), by: (user && user.name) || api.me().name, title: payload.title, note: 'সেভ #' + mcBn(dd.revisions.filter(r => r.newsId === old.id).length + 1), snapshot: { content: old.content, excerpt: old.excerpt, title: old.title, status: old.status } });
                            dd.news[i] = { ...old, ...payload, id: old.id };
                        }
                    }
                });
                setSavedAt(mcNowISO());
                try { localStorage.setItem('mcms_draft_' + (id || 'new'), JSON.stringify(payload)); } catch (e) { }
                mcToast(isNew ? 'নতুন সংবাদ তৈরি হয়েছে (ডেমো)' : 'সংবাদ সংরক্ষিত হয়েছে');
                if (isNew) navigate('/admin/news/' + (MC_STORE.load().news[0].id));
            };
            const restore = (r) => { patch({ title: r.snapshot.title, excerpt: r.snapshot.excerpt, content: r.snapshot.content, blocks: mcHtmlToBlocks(r.snapshot.content) }); mcToast('রিভিশন ফিরিয়ে আনা হয়েছে: ' + r.note); };
            const revisions = (db.revisions || []).filter(r => String(r.newsId) === String(id));
            const seo = d.seo || {};
            const media = db.media || [];
            const chars = String(mcBlocksToHtml(d.blocks || [])).replace(/<[^>]*>/g, '').trim().length;

            return (
                <form className="space-y-5" onSubmit={(e) => { e.preventDefault(); doSave({ status: d.status }); }}>
                    <div className="flex flex-wrap items-center justify-between gap-3 border-b border-gray-200 pb-3 dark:border-gray-700">
                        <div className="flex items-center gap-2">
                            <button type="button" onClick={() => navigate('/admin/news')} className={MC_ICON_BTN} aria-label="তালিকায় ফিরুন"><i className="ph ph-arrow-left"></i></button>
                            <h2 className="font-serif text-xl font-bold text-gray-900 dark:text-white">{isNew ? 'নতুন সংবাদ' : 'সংবাদ সম্পাদনা'}</h2>
                            <McTag tone={MC_STATUS_TONE[d.status] || 'gray'}>{(api.getSettings().statuses || {})[d.status] || d.status}</McTag>
                            {savedAt && <span className="text-[11px] text-gray-500"><i className="ph ph-check-circle mr-1 text-[#1F7A3D]"></i>সংরক্ষিত {new Date(savedAt).toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' })} · {mcBn(chars)} অক্ষর</span>}
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            {!isNew && <button type="button" onClick={() => navigate('/article', { id })} className="rounded-lg border border-gray-300 px-3 py-1.5 text-sm font-bold text-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300">প্রিভিউ</button>}
                            <button type="button" onClick={() => doSave({ status: 'draft' })} className="rounded-lg border border-gray-300 px-3 py-1.5 text-sm font-bold text-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300">খসড়া সেভ</button>
                            {!isNew && <button type="button" onClick={() => doSave({ status: 'pending' })} className="rounded-lg border border-amber-400 px-3 py-1.5 text-sm font-bold text-amber-700 hover:bg-amber-50 dark:text-amber-300">রিভিউতে পাঠান</button>}
                            <button type="button" onClick={() => { if (!d.scheduledFor && !(d.publishedAt && new Date(d.publishedAt) > new Date())) { mcToast('শিডিউল করতে আগে “নির্ধারিত প্রকাশের সময়” বা ভবিষ্যতের প্রকাশের তারিখ দিন', 'err'); return; } doSave({ status: 'scheduled' }); }} className="rounded-lg border border-blue-500 px-3 py-1.5 text-sm font-bold text-blue-700 hover:bg-blue-50 dark:text-blue-300"><i className="ph ph-calendar-plus mr-1"></i>শিডিউল</button>
                            <button type="button" onClick={() => doSave({ status: 'published' })} className="rounded-lg bg-brand-red px-4 py-1.5 text-sm font-bold text-white hover:bg-red-700"><i className="ph ph-upload-simple mr-1"></i>প্রকাশ করুন</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 gap-5 xl:grid-cols-12">
                        <div className="space-y-5 xl:col-span-8">
                            <McPanel title="মূল তথ্য">
                                <div className="space-y-3">
                                    <input value={d.title} onChange={(e) => { const t = e.target.value; setD(p => ({ ...p, title: t, slug: p.slug || mcSlug(t) })); }} placeholder="সংবাদের শিরোনাম লিখুন…" className="w-full border-b-2 border-gray-200 bg-transparent pb-2 font-serif text-2xl font-bold text-gray-900 outline-none focus:border-brand-red dark:border-gray-700 dark:text-white" />
                                    <div className="flex flex-wrap items-center gap-2 text-sm">
                                        <span className="font-bold text-gray-600 dark:text-gray-300">permalink:</span>
                                        <code className="rounded bg-gray-100 px-2 py-1 text-[12px] text-gray-600 dark:bg-gray-900 dark:text-gray-400">#/news/{d.slug || '…'}</code>
                                        <button type="button" onClick={() => set('slug', mcSlug(d.title))} className="text-[12px] font-bold text-brand-red hover:underline">পুনরায় তৈরি</button>
                                        <input value={d.slug} onChange={(e) => set('slug', e.target.value.replace(/\s+/g, '-'))} className="min-w-[16ch] flex-1 rounded border border-gray-300 px-2 py-1 text-[12px] dark:border-gray-600 dark:bg-gray-900 dark:text-white" />
                                    </div>
                                    <McField label="সাব-হেড / সংক্ষিপ্তসার" hint="ফেসবুক পোস্ট থেকে “বিস্তারিত পড়ুন →”-এর পর এই লাইনটিই প্রথমে দেখা যায় — ৮০–১৬০ অক্ষর আদর্শ">
                                        <textarea rows="3" maxLength="280" value={d.excerpt} onChange={(e) => set('excerpt', e.target.value)} className={MC_INPUT} placeholder="মূল কথা এক-দুই লাইনে…" />
                                    </McField>
                                    <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
                                        <McField label="লেখক (রিপোর্টার)"><select className={MC_INPUT} value={d.authorId || ''} onChange={(e) => set('authorId', e.target.value)}>{MOCK_USERS.reporters.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}</select></McField>
                                        <McField label="বিভাগ"><select className={MC_INPUT} value={d.categoryId} onChange={(e) => set('categoryId', e.target.value)}>{db.categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></McField>
                                        <McField label="সাব-ক্যাটাগরি"><select className={MC_INPUT} value={d.subCategoryId || ''} onChange={(e) => set('subCategoryId', e.target.value)}><option value="">— নেই —</option>{((db.categories.find(c => c.id === d.categoryId) || {}).subs || []).map(s => <option key={s.id || s} value={s.id || s}>{s.name || s}</option>)}</select></McField>
                                    </div>
                                    <McField label="ট্যাগ" hint="কমা দিয়ে আলাদা করুন — ট্যাগ পেজ ও Related সংবাদে কাজ করে"><input className={MC_INPUT} value={tagText} onChange={(e) => setTagText(e.target.value)} placeholder="মহালছড়ি, বন্যা, শিক্ষা" /></McField>
                                </div>
                            </McPanel>

                            <McPanel title="মূল লেখা (ব্লক এডিটর)" desc="অনুচ্ছেদ, শিরোনাম, উদ্ধৃতি, তালিকা, ছবি, টেবিল — যেকোনো ক্রমে সাজান (২১ নম্বর ফরম্যাট)"
                                actions={<div className="flex flex-wrap gap-1">{MC_BLOCK_TYPES.map(b => <button key={b.v} type="button" title={b.l} onClick={() => addBlock(b.v)} className={MC_ICON_BTN}><i className={`ph ${b.icon}`}></i></button>)}</div>}>
                                <div className="space-y-3">
                                    {(d.blocks || []).map((b, i) => (
                                        <div key={i} className={`rounded-lg border p-3 ${b.t === 'important' ? 'border-[#1F7A3D] bg-[#EAF7EC] dark:bg-[#12291C]' : 'border-gray-200 dark:border-gray-700'}`}>
                                            <div className="mb-2 flex items-center gap-2">
                                                <select value={b.t} onChange={(e) => setBlock(i, { t: e.target.value })} className="rounded border border-gray-300 bg-white px-2 py-1 text-xs font-bold dark:border-gray-600 dark:bg-gray-900 dark:text-white">{MC_BLOCK_TYPES.map(t => <option key={t.v} value={t.v}>{t.l}</option>)}</select>
                                                <span className="text-[11px] text-gray-400">ব্লক {mcBn(i + 1)}</span>
                                                <span className="ml-auto flex items-center gap-1.5">
                                                    <button type="button" className={MC_ICON_BTN} onClick={() => moveBlock(i, -1)} title="উপরে" aria-label="উপরে"><i className="ph ph-arrow-up"></i></button>
                                                    <button type="button" className={MC_ICON_BTN} onClick={() => moveBlock(i, 1)} title="নিচে" aria-label="নিচে"><i className="ph ph-arrow-down"></i></button>
                                                    <button type="button" className={MC_ICON_BTN} onClick={() => setD(p => ({ ...p, blocks: [...p.blocks.slice(0, i + 1), { t: b.t, v: b.v, caption: b.caption }, ...p.blocks.slice(i + 1)] }))} title="কপি" aria-label="কপি"><i className="ph ph-copy"></i></button>
                                                    <button type="button" className={MC_ICON_BTN} onClick={() => delBlock(i)} title="মুছুন" aria-label="মুছুন"><i className="ph ph-trash"></i></button>
                                                </span>
                                            </div>
                                            {b.t === 'img' ? (
                                                <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
                                                    <input className={MC_INPUT} placeholder="ছবির লিঙ্ক" value={b.v} onChange={(e) => setBlock(i, { v: e.target.value })} />
                                                    <input className={MC_INPUT} placeholder="ক্যাপশন" value={b.caption || ''} onChange={(e) => setBlock(i, { caption: e.target.value })} />
                                                </div>
                                            ) : (
                                                <textarea rows={b.t === 'p' ? 4 : 2} className={`${MC_INPUT} ${b.t === 'h2' ? 'font-serif text-lg font-bold' : ''}`} value={b.v} onChange={(e) => setBlock(i, { v: e.target.value })} placeholder={b.t === 'ul' ? 'প্রতি লাইনে একটি করে আইটেম' : b.t === 'table' ? 'কলাম | কলাম | কলাম' : ''} />
                                            )}
                                            {media.length > 0 && b.t !== 'table' && (
                                                <select className={`${MC_INPUT} mt-2 !w-auto !py-1 text-[11px]`} value="" onChange={(e) => { if (e.target.value) setBlock(i, { v: e.target.value }); }} aria-label="মিডিয়া লাইব্রেরি থেকে বাছুন">
                                                    <option value="">মিডিয়া লাইব্রেরি থেকে বাছুন…</option>
                                                    {media.map(m => <option key={m.id} value={m.src}>{m.title || String(m.src).slice(0, 40)}</option>)}
                                                </select>
                                            )}
                                        </div>
                                    ))}
                                    {!(d.blocks || []).length && <p className="rounded border border-dashed border-gray-300 py-6 text-center text-sm text-gray-500">কোনো ব্লক নেই — উপরের আইকন দিয়ে যোগ করুন।</p>}
                                </div>
                            </McPanel>

                            <McPanel title="ইমেজ গ্যালারি (১৪)" desc="একাধিক ছবি — ক্যাপশন, alt, ক্রেডিট ও ক্রম পরিবর্তনযোগ্য">
                                <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                                    <McField label="ছবির URL"><input id="g-url" className={MC_INPUT} placeholder="https://…/photo.jpg" /></McField>
                                    <McField label="ক্যাপশন"><input id="g-cap" className={MC_INPUT} placeholder="কী ঘটনা — কেউ থাকলে তাঁর নাম/পদবি" /></McField>
                                    <McField label="Alt টেক্সট (SEO)"><input id="g-alt" className={MC_INPUT} placeholder="অন্তঃপ্রজন্ম বর্ণনা" /></McField>
                                    <McField label="ছবি: ক্রেডিট"><input id="g-credit" className={MC_INPUT} placeholder="ফারুক আহমদ / সংবাদদাতা" /></McField>
                                    <McField label="বিবরণ (লাইটবক্সে দেখাবে)"><input id="g-desc" className={MC_INPUT} placeholder="ছবিটি কী বোঝাচ্ছে — এক লাইনে" /></McField>
                                </div>
                                <div className="mt-3 flex flex-wrap gap-2">
                                    <button type="button" className="rounded-lg bg-[#1F7A3D] px-3.5 py-2 text-sm font-bold text-white hover:bg-[#166033]" onClick={() => {
                                        const g = (sel) => (document.getElementById(sel) || {}).value || '';
                                        if (!g('g-url').trim()) { mcToast('প্রথমে ছবির URL দিন', 'err'); return; }
                                        setD(p => ({ ...p, gallery: [...(p.gallery || []), { id: mcUid('m'), src: g('g-url').trim(), caption: g('g-cap'), alt: g('g-alt'), credit: g('g-credit'), desc: g('g-desc'), order: (p.gallery || []).length }] }));
                                        ['g-url', 'g-cap', 'g-alt', 'g-credit', 'g-desc'].forEach(i => { document.getElementById(i).value = ''; });
                                        mcToast('গ্যালারিতে যোগ হয়েছে');
                                    }}><i className="ph ph-plus mr-1"></i> গ্যালারিতে যোগ করুন</button>
                                    <button type="button" className="rounded-lg border border-gray-300 px-3.5 py-2 text-sm font-bold text-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300" onClick={() => { const m = media[0]; if (m) setD(p => ({ ...p, gallery: [...(p.gallery || []), { src: m.src, caption: m.title || '', alt: m.title || '', credit: 'মিডিয়া লাইব্রেরি' }] })); mcToast('মিডিয়া লাইব্রেরি থেকে যোগ হয়েছে'); }}>লাইব্রেরি থেকে যোগ করুন</button>
                                    {(media.length === 0) && <span className="self-center text-[11px] text-gray-500">(মিডিয়া লাইব্রেরি খালি — টাইপ করে URL দিন)</span>}
                                </div>
                                {(d.gallery || []).length > 0 && (
                                    <ul className="mt-4 space-y-2">
                                        {d.gallery.map((g, i) => (
                                            <li key={g.id || i} draggable onDragStart={() => { dragFrom.current = i; }} onDragOver={(e) => e.preventDefault()} onDrop={() => dropImg(i)}
                                                className="flex cursor-grab items-center gap-3 rounded-lg border border-gray-200 p-2 active:cursor-grabbing dark:border-gray-700" title="ধরে টেনে ক্রম বদলান">
                                                <img src={g.src} alt="" onError={imgFallback} className="h-14 w-20 shrink-0 rounded object-cover" />
                                                <div className="min-w-0 flex-1 text-[12px]">
                                                    <p className="truncate font-bold text-gray-800 dark:text-gray-200">{g.caption || 'ক্যাপশন নেই'}</p>
                                                    <p className="truncate text-gray-500">{g.alt ? 'alt: ' + g.alt : 'alt নেই'}{g.credit ? ' · ছবি: ' + g.credit : ''}{g.desc ? ' · ' + g.desc : ''}</p>
                                                </div>
                                                <span className="flex shrink-0 items-center gap-1.5">
                                                    <button type="button" className={MC_ICON_BTN} onClick={() => moveImg(i, -1)} title="আগে" aria-label="আগে"><i className="ph ph-arrow-up"></i></button>
                                                    <button type="button" className={MC_ICON_BTN} onClick={() => moveImg(i, 1)} title="পরে" aria-label="পরে"><i className="ph ph-arrow-down"></i></button>
                                                    <button type="button" className={MC_ICON_BTN} title="প্রধান ছবি হিসেবে ঠিক করুন" aria-label="প্রধান ছবি" onClick={() => { patch({ image: g.src, imageCaption: g.caption || g.alt, imageCredit: g.credit }); mcToast('প্রধান ছবি পরিবর্তন হয়েছে'); }}><i className="ph ph-star"></i></button>
                                                    <button type="button" className={MC_ICON_BTN} onClick={() => setD(p => ({ ...p, gallery: p.gallery.filter((_, j) => j !== i) }))} title="সরান" aria-label="সরান"><i className="ph ph-x"></i></button>
                                                </span>
                                            </li>
                                        ))}
                                    </ul>
                                )}
                            </McPanel>
                        </div>

                        {/* সাইডবার কলাম */}
                        <div className="space-y-5 xl:col-span-4">
                            <McPanel title="প্রকাশ (১৩.২)">
                                <div className="space-y-3">
                                    <McField label="অবস্থা"><select className={MC_INPUT} value={d.status} onChange={(e) => set('status', e.target.value)}>{Object.keys(api.getSettings().statuses || {}).map(k => <option key={k} value={k}>{api.getSettings().statuses[k]}</option>)}</select></McField>
                                    {d.status === 'scheduled' && (
                                        <McField label="নির্ধারিত প্রকাশের সময়" hint="সময় হলে অটো প্রকাশিত হবে (ডেমোতে তালিকা রিফ্রেশে দেখা যায়)"><input type="datetime-local" className={MC_INPUT} value={String(d.scheduledFor || '').slice(0, 16)} onChange={(e) => set('scheduledFor', e.target.value ? new Date(e.target.value).toISOString() : '')} /></McField>
                                    )}
                                    <div className="grid grid-cols-2 gap-2">
                                        <McField label="প্রকাশের তারিখ"><input type="date" className={MC_INPUT} value={pYmd()} onChange={(e) => setPublishPart('date', e.target.value)} /></McField>
                                        <McField label="প্রকাশের সময়"><input type="time" className={MC_INPUT} value={pHm()} onChange={(e) => setPublishPart('time', e.target.value)} /></McField>
                                    </div>
                                    {d.publishedAt && <p className="text-[11px] text-gray-500">সাইটে দেখাবে: {formatBanglaDate(d.publishedAt)}</p>}
                                    <label className="flex items-center gap-2 text-sm font-semibold text-gray-700 dark:text-gray-300"><input type="checkbox" className="h-4 w-4 rounded border-gray-300 text-brand-red" checked={!!d.isFeatured} onChange={(e) => set('isFeatured', e.target.checked)} /> ফিচার্ড (হোম হিরো)</label>
                                    <label className="flex items-center gap-2 text-sm font-semibold text-gray-700 dark:text-gray-300"><input type="checkbox" className="h-4 w-4 rounded border-gray-300 text-brand-red" checked={d.allowComments !== false} onChange={(e) => set('allowComments', e.target.checked)} /> মন্তব্যের অনুমতি</label>
                                    <details className="rounded-lg border border-gray-200 p-2 text-[12px] dark:border-gray-700">
                                        <summary className="cursor-pointer font-bold text-gray-700 dark:text-gray-300">ব্রেকিং নিউজ (২৯)</summary>
                                        <div className="mt-2 space-y-2">
                                            <label className="flex items-center gap-2"><input type="checkbox" className="h-4 w-4 rounded border-gray-300 text-brand-red" checked={!!(d.breaking && d.breaking.on)} onChange={(e) => set('breaking', { ...(d.breaking || {}), on: e.target.checked, startAt: d.breaking && d.breaking.startAt, endAt: d.breaking && d.breaking.endAt })} /> ব্রেকিং টিকেয়ারে দেখান</label>
                                            <McField label="শুরু"><input type="datetime-local" className={MC_INPUT} value={String((d.breaking || {}).startAt || '').slice(0, 16)} onChange={(e) => set('breaking', { ...(d.breaking || {}), on: true, startAt: new Date(e.target.value).toISOString() })} /></McField>
                                            <McField label="শেষ"><input type="datetime-local" className={MC_INPUT} value={String((d.breaking || {}).endAt || '').slice(0, 16)} onChange={(e) => set('breaking', { ...(d.breaking || {}), on: true, endAt: new Date(e.target.value).toISOString() })} /></McField>
                                        </div>
                                    </details>
                                </div>
                            </McPanel>

                            <McPanel title="প্রধান ছবি" desc="অনুপাত ১৬:৯ · WebP/প্রতিস্থাপন যোগ্য">
                                <div className="space-y-2">
                                    {d.image ? <img src={d.image} alt="" onError={imgFallback} className="aspect-video w-full rounded-lg object-cover" /> : <div className="flex aspect-video w-full items-center justify-center rounded-lg border border-dashed border-gray-300 text-sm text-gray-400 dark:border-gray-700">ছবি নেই</div>}
                                    <input className={MC_INPUT} value={d.image || ''} onChange={(e) => set('image', e.target.value)} placeholder="ছবির URL" />
                                    <input className={MC_INPUT} value={d.imageCaption || ''} onChange={(e) => set('imageCaption', e.target.value)} placeholder="ক্যাপশন / Alt টেক্সট" />
                                    <input className={MC_INPUT} value={d.imageCredit || ''} onChange={(e) => set('imageCredit', e.target.value)} placeholder="ছবি: ক্রেডিট" />
                                </div>
                            </McPanel>

                            <McPanel title="ভিডিও / ফেসবুক লিঙ্ক" desc="পোস্টের ফেসবুক ভিডিও URL দিলে নিউজ পেজে এমবেড হবে">
                                <input className={MC_INPUT} value={d.videoUrl || ''} onChange={(e) => set('videoUrl', e.target.value)} placeholder="https://www.facebook.com/…/videos/123456/" />
                            </McPanel>

                            <McPanel title="SEO (২৪)" desc="সংক্ষিপ্তসার ফাঁকা থাকলে গল্পের প্রথম ১৬০ অক্ষর ব্যবহৃত হয়">
                                <div className="space-y-2">
                                    <McField label={'মেটা টাইটেল (' + mcBn(String(seo.title || d.title || '').length) + '/৬০)'}><input className={MC_INPUT} value={seo.title || ''} onChange={(e) => set('seo', { ...seo, title: e.target.value })} placeholder={d.title} /></McField>
                                    <McField label={'মেটা বিবরণ (' + mcBn(String(seo.desc || '').length) + '/১৬০)'}><textarea rows="3" className={MC_INPUT} value={seo.desc || ''} onChange={(e) => set('seo', { ...seo, desc: e.target.value })} placeholder={String(d.excerpt || '').slice(0, 160)} /></McField>
                                    <McField label="ফোকাস কীওয়ার্ড"><input className={MC_INPUT} value={seo.keyword || ''} onChange={(e) => set('seo', { ...seo, keyword: e.target.value })} /></McField>
                                    <McField label="OG ইমেজ (শেয়ারের ছবি)" hint="খালি রাখলে প্রধান ছবি ব্যবহৃত হয়" preview>
                                        <input className={MC_INPUT} value={seo.og || ''} onChange={(e) => set('seo', { ...seo, og: e.target.value })} placeholder="https://…/og.webp" />
                                    </McField>
                                    <McField label="ক্যানোনিকাল URL"><input className={MC_INPUT} value={seo.canonical || ''} onChange={(e) => set('seo', { ...seo, canonical: e.target.value })} placeholder="https://mahalcharinews.com/news/…" /></McField>
                                    <label className="flex items-center gap-2 text-[13px] font-semibold text-gray-700 dark:text-gray-300"><input type="checkbox" className="h-4 w-4 rounded border-gray-300 text-brand-red" checked={!!seo.noindex} onChange={(e) => set('seo', { ...seo, noindex: e.target.checked })} /> search engine থেকে লুকান (noindex)</label>
                                    <p className="rounded bg-gray-50 p-2 text-[11px] leading-relaxed text-gray-500 dark:bg-gray-900/50">NewsArticle schema স্বয়ংক্রিয়ভাবে যুক্ত হয় · OG:image = প্রধান ছবি</p>
                                </div>
                            </McPanel>

                            {!isNew && (
                                <McPanel title={'রিভিশন (' + mcBn(revisions.length) + ')'} desc="প্রতিটি সেভে পুরোনো সংস্করণ সংরক্ষিত">
                                    <ul className="space-y-2 text-[12px]">
                                        {revisions.slice(0, 6).map(r => (
                                            <li key={r.id} className="flex items-center gap-2 border-b border-gray-100 pb-2 last:border-0 dark:border-gray-700">
                                                <i className="ph ph-clock-counter-clockwise text-gray-400"></i>
                                                <span className="min-w-0 flex-1 truncate text-gray-600 dark:text-gray-400">{r.note} · {r.by} · {timeAgo(r.at)}</span>
                                                <button type="button" onClick={() => restore(r)} className="font-bold text-brand-red hover:underline">ফিরিয়ে আনুন</button>
                                            </li>
                                        ))}
                                        {!revisions.length && <li className="text-gray-500">এখনো কোনো রিভিশন নেই — পরবর্তী সেভে প্রথম সংস্করণ জমা হবে।</li>}
                                    </ul>
                                </McPanel>
                            )}

                            <div className="rounded-lg border border-dashed border-amber-400 bg-amber-50 p-3 text-[11px] leading-relaxed text-amber-900 dark:bg-amber-900/20 dark:text-amber-200">
                                <b><i className="ph ph-flask mr-1"></i>ডেমো মোড:</b> এখানে যোগ/সম্পাদনা করা সব লেখা ব্রাউজারের localStorage-এ জমা হয় এবং ডেমো-লেবেলসহ প্রকাশিত হয়। বাস্তব সংবাদ এতে যোগ করবেন না।
                            </div>
                        </div>
                    </div>
                </form>
            );
        };

        // ==================================================================
        //  ক্যাটাগরি ও সাব-ক্যাটাগরি (১৬) — ক্রম, লুকানো, রঙ, আইকন
        // ==================================================================
        const McAdminCategories = () => {
            const db = useMcStore();
            const [add, setAdd] = React.useState('');
            const [subFor, setSubFor] = React.useState(null);
            const [subName, setSubName] = React.useState('');
            const rows = db.categories;
            const move = (i, dir) => MC_STORE.mutate('update:categories:ক্রম', (d) => { const j = i + dir; if (j < 0 || j >= d.categories.length) return; [d.categories[i], d.categories[j]] = [d.categories[j], d.categories[i]]; d.categories.forEach((c, k) => { c.order = k; }); });
            const toggle = (c) => MC_STORE.mutate('update:categories:' + c.name, (d) => { const x = d.categories.find(y => y.id === c.id); x.status = x.status === 'hide' ? 'show' : 'hide'; });
            const patch = (c, o) => MC_STORE.mutate('update:categories:' + c.name, (d) => { const x = d.categories.find(y => y.id === c.id); Object.assign(x, o); });
            const create = (e) => {
                e.preventDefault();
                const name = add.trim(); if (!name) return;
                MC_STORE.mutate('create:categories:' + name, (d) => {
                    d.categories.push({ id: mcSlug(name) || mcUid('cat'), name, slug: mcSlug(name) || mcUid('cat'), description: '', icon: 'ph-newspaper', color: '#E21D2B', status: 'show', order: d.categories.length, subs: [], demo: true });
                });
                setAdd(''); mcToast('নতুন বিভাগ যোগ হয়েছে');
            };
            const remove = (c) => {
                const count = db.news.filter(n => n.categoryId === c.id).length;
                if (c.demo !== true) { mcToast('শুধু ডেমো বিভাগ মুছে ফেলা যাবে (বাস্তবে রি-অ্যাসাইন ফর্ম দেখানো হয়)', 'err'); return; }
                MC_STORE.mutate('update:categories:' + c.name, (d) => {
                    const x = d.categories.find(y => y.id === c.id);
                    x.prevStatus = x.status; x.status = 'trash'; x.trashedAt = mcNowISO();   // রিসাইকল বিনে থাকে, ফেরানো যাবে
                    const rest = d.categories.filter(y => y.status !== 'trash');
                    d.news.forEach(n => { if (n.categoryId === c.id && rest.length) n.categoryId = rest[0].id; });
                    rest.forEach((y, k) => { y.order = k; });
                });
                mcToast('“' + c.name + '” ট্র্যাশে; ' + mcBn(count) + ' টি সংবাদ প্রথম বিভাগে স্থানান্তরিত');
            };
            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-end justify-between gap-3">
                        <div><h2 className="font-serif text-2xl font-bold text-gray-900 dark:text-white">ক্যাটাগরি ও সাব-ক্যাটাগরি</h2><p className="text-xs text-gray-500">ক্রম বদলানো, লুকানো ও সাব-বিভাগ — হোমপেজ ও মেনুতে সঙ্গে সঙ্গে প্রভাব ফেলে</p></div>
                        <form onSubmit={create} className="flex items-center gap-2">
                            <input value={add} onChange={(e) => setAdd(e.target.value)} placeholder="নতুন বিভাগের নাম" className={MC_INPUT + ' !w-52'} />
                            <button className="rounded-lg bg-brand-red px-3.5 py-2 text-sm font-bold text-white hover:bg-red-700"><i className="ph ph-plus"></i> যোগ</button>
                        </form>
                    </div>
                    <div className="overflow-hidden rounded-lg border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800">
                        {rows.map((c, i) => {
                            const count = db.news.filter(n => n.categoryId === c.id).length;
                            const live = db.news.filter(n => n.categoryId === c.id && mcIsLive(n)).length;
                            return (
                                <div key={c.id} className={`flex flex-wrap items-center gap-3 border-b border-gray-100 p-3 last:border-0 dark:border-gray-700 ${c.status === 'hide' ? 'opacity-60' : ''}`}>
                                    <span className="flex flex-col">
                                        <button className="text-gray-400 hover:text-brand-red" onClick={() => move(i, -1)} aria-label={"উপরে"} disabled={i === 0}><i className="ph ph-caret-up"></i></button>
                                        <button className="text-gray-400 hover:text-brand-red" onClick={() => move(i, 1)} aria-label={"নিচে"} disabled={i === rows.length - 1}><i className="ph ph-caret-down"></i></button>
                                    </span>
                                    <span className="h-8 w-1.5 rounded-full" style={{ background: c.color || '#E21D2B' }}></span>
                                    <div className="min-w-[16ch] flex-1">
                                        <input value={c.name} onChange={(e) => patch(c, { name: e.target.value })} className="w-full rounded border border-transparent bg-transparent px-1 font-serif text-[15px] font-bold text-gray-900 hover:border-gray-300 focus:border-brand-red focus:outline-none dark:text-white dark:hover:border-gray-600" />
                                        <code className="ml-1 text-[11px] text-gray-500">#/category/{c.slug}</code>
                                    </div>
                                    <input value={c.icon} onChange={(e) => patch(c, { icon: e.target.value })} className="w-32 rounded border border-gray-200 bg-transparent px-2 py-1 text-[11px] text-gray-500 dark:border-gray-700" aria-label="আইকন" />
                                    <span className="text-[11px] font-semibold text-gray-500">{mcBn(live)} প্রকাশিত / {mcBn(count)}</span>
                                    <div className="flex flex-wrap items-center gap-1">
                                        {(c.subs || []).map(s => <span key={s.id || s} className="inline-flex items-center gap-1 rounded-full bg-gray-100 px-2 py-0.5 text-[11px] text-gray-600 dark:bg-gray-700 dark:text-gray-300">{s.name || s}
                                            <button onClick={() => patch(c, { subs: (c.subs || []).filter(x => (x.id || x) !== (s.id || s)) })} aria-label={"সাব-বিভাগ মুছুন"} className="hover:text-brand-red"><i className="ph ph-x"></i></button></span>)}
                                        <button onClick={() => { setSubFor(c.id); setSubName(''); }} className="rounded-full border border-dashed border-gray-300 px-2 py-0.5 text-[11px] text-gray-500 hover:border-brand-red hover:text-brand-red dark:border-gray-600">+ সাব-বিভাগ</button>
                                    </div>
                                    {subFor === c.id && (
                                        <form className="flex items-center gap-1" onSubmit={(e) => { e.preventDefault(); const n = subName.trim(); if (!n) return; MC_STORE.mutate('update:categories:সাব-বিভাগ', (d) => { const x = d.categories.find(y => y.id === c.id); x.subs = [...(x.subs || []), { id: mcSlug(n), name: n, slug: mcSlug(n) }]; }); setSubFor(null); mcToast('সাব-বিভাগ যোগ হয়েছে'); }}>
                                            <input autoFocus value={subName} onChange={(e) => setSubName(e.target.value)} placeholder="যেমন: ইউনিয়ন" className="w-28 rounded border border-gray-300 px-2 py-1 text-xs dark:border-gray-600 dark:bg-gray-900 dark:text-white" />
                                            <button className="rounded bg-[#1F7A3D] px-2 py-1 text-xs font-bold text-white">যোগ</button>
                                        </form>
                                    )}
                                    <button onClick={() => toggle(c)} className={`rounded-lg border px-2.5 py-1 text-[11px] font-bold ${c.status === 'hide' ? 'border-gray-300 text-gray-500 dark:border-gray-600' : 'border-[#1F7A3D] text-[#1F7A3D]'}`}><i className={`ph ${c.status === 'hide' ? 'ph-eye-slash' : 'ph-eye'} mr-1`}></i>{c.status === 'hide' ? 'লুকানো' : 'দৃশ্যমান'}</button>
                                    <button onClick={() => remove(c)} className={MC_ICON_BTN} aria-label="মুছুন"><i className="ph ph-trash-simple"></i></button>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ==================================================================
        //  মন্তব্য মডারেশন (১২)
        // ==================================================================
        const McAdminComments = () => {
            const { navigate } = React.useContext(AppContext);
            const db = useMcStore();
            const [tab, setTab] = React.useState('pending');
            const [sel, setSel] = React.useState([]);
            const [replyTo, setReplyTo] = React.useState(null);
            const [reply, setReply] = React.useState('');
            const rows = db.comments.filter(c => tab === 'all' ? true : c.status === tab);
            const act = (ids, status) => { MC_STORE.mutate('update:comments:' + status, (d) => d.comments.forEach(c => { if (ids.includes(c.id)) c.status = status; })); setSel([]); mcToast(mcBn(ids.length) + ' টি “' + (mcStatusMeta[status] ? mcStatusMeta[status][0] : status) + '” করা হয়েছে'); };
            const del = (id) => { MC_STORE.mutate('update:comments:trash', (d) => { const c = d.comments.find(x => x.id === id); c.prevStatus = c.status; c.status = 'trash'; c.trashedAt = mcNowISO(); }); mcToast('মন্তব্যটি ট্র্যাশে গেছে (রিসাইকল বিন থেকে ফেরানো যাবে)'); };
            const hide = (id) => { MC_STORE.mutate('update:comments:hidden', (d) => { const c = d.comments.find(x => x.id === id); c.prevStatus = c.status; c.status = 'deleted'; }); mcToast('মন্তব্য লুকানো হয়েছে — সাইটে দেখাবে না'); };
            const restoreC = (id) => { MC_STORE.mutate('update:comments:restore', (d) => { const c = d.comments.find(x => x.id === id); c.status = c.prevStatus || 'pending'; delete c.prevStatus; }); mcToast('মন্তব্য ফিরিয়ে আনা হয়েছে'); };
            const purgeC = (id) => { MC_STORE.mutate('delete:comments:আইটেম', (d) => { d.comments = d.comments.filter(c => c.id !== id); }); mcToast('মন্তব্যটি স্থায়ীভাবে মুছে ফেলা হয়েছে', 'err'); };
            const sendReply = (c) => {
                if (!reply.trim()) return;
                MC_STORE.mutate('create:comments:উত্তর', (d) => { d.comments.unshift({ id: mcUid('c'), newsId: c.newsId, name: SITE.name + ' (সম্পাদক)', body: reply.trim(), createdAt: mcNowISO(), status: 'approved', replyTo: c.id }); });
                setReplyTo(null); setReply(''); mcToast('উত্তর প্রকাশিত হয়েছে');
            };
            const tabs = [['pending', 'অনুমোদনের অপেক্ষায়'], ['approved', 'প্রকাশিত'], ['rejected', 'বাতিল'], ['spam', 'স্প্যাম'], ['trash', 'ট্র্যাশ'], ['all', 'সব']];
            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-end justify-between gap-3">
                        <div><h2 className="font-serif text-2xl font-bold text-gray-900 dark:text-white">মন্তব্য মডারেশন</h2><p className="text-xs text-gray-500">অ্যাকাউন্ট ছাড়া মন্তব্য — মডারেটর ছাড়া প্রকাশিত হয় না</p></div>
                        {sel.length > 0 && <div className="flex items-center gap-2 text-xs"><b>{mcBn(sel.length)} নির্বাচিত</b>{['approved', 'rejected', 'spam'].map(s => <button key={s} onClick={() => act(sel, s)} className="rounded border border-gray-300 bg-white px-2 py-1 font-semibold hover:border-brand-red dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200">{mcStatusMeta[s][0]}</button>)}</div>}
                    </div>
                    <div className="flex flex-wrap gap-1.5">
                        {tabs.map(([k, l]) => <button key={k} onClick={() => setTab(k)} className={`rounded-full px-3.5 py-1.5 text-[13px] font-bold ${tab === k ? 'bg-brand-red text-white' : 'border border-gray-300 text-gray-600 hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300'}`}>{l} <span className="opacity-70">{mcBn(db.comments.filter(c => k === 'all' ? true : c.status === k).length)}</span></button>)}
                    </div>
                    <div className="space-y-3">
                        {rows.map(c => {
                            const n = db.news.find(x => String(x.id) === String(c.newsId));
                            return (
                                <div key={c.id} className="rounded-lg border border-gray-200 bg-white p-4 dark:border-gray-700 dark:bg-gray-800">
                                    <div className="flex flex-wrap items-center gap-2 text-[12px]">
                                        <input type="checkbox" checked={sel.includes(c.id)} onChange={() => setSel(s => s.includes(c.id) ? s.filter(x => x !== c.id) : [...s, c.id])} className="h-4 w-4 rounded border-gray-300 text-brand-red" />
                                        <b className="text-gray-900 dark:text-white">{c.name}</b>
                                        <span className="text-gray-500">{timeAgo(c.createdAt)} · {c.ip}</span>
                                        <McTag tone={c.status === 'approved' ? 'green' : c.status === 'pending' ? 'amber' : 'red'}>{(mcStatusMeta[c.status] || [c.status])[0]}</McTag>
                                        {c.flagged && <McTag tone="red"><i className="ph ph-warning"></i> আপত্তিকর শব্দ</McTag>}
                                        {n && <button onClick={() => navigate('/article', { id: n.id })} className="ml-auto truncate text-gray-500 hover:text-brand-red"><i className="ph ph-link mr-1"></i>{n.title}</button>}
                                    </div>
                                    <p className="mt-2 text-sm leading-relaxed text-gray-700 dark:text-gray-300">{c.body}</p>
                                    <div className="mt-3 flex flex-wrap items-center gap-2">
                                        {c.status !== 'approved' && <button onClick={() => act([c.id], 'approved')} className="rounded-lg bg-[#1F7A3D] px-3 py-1.5 text-xs font-bold text-white hover:bg-[#166033]"><i className="ph ph-check mr-1"></i>অনুমোদন</button>}
                                        {c.status !== 'rejected' && <button onClick={() => act([c.id], 'rejected')} className="rounded-lg border border-gray-300 px-3 py-1.5 text-xs font-bold text-gray-700 hover:border-brand-red hover:text-brand-red dark:border-gray-600 dark:text-gray-300">বাতিল</button>}
                                        <button onClick={() => act([c.id], 'spam')} className="rounded-lg border border-gray-300 px-3 py-1.5 text-xs font-bold text-gray-700 hover:border-brand-red hover:text-brand-red dark:border-gray-600 dark:text-gray-300">স্প্যাম</button>
                                        <button onClick={() => { setReplyTo(replyTo === c.id ? null : c.id); setReply(''); }} className="rounded-lg border border-gray-300 px-3 py-1.5 text-xs font-bold text-gray-700 dark:border-gray-600 dark:text-gray-300">উত্তর দিন</button>
                                        {c.status !== 'deleted' && c.status !== 'trash' && <button onClick={() => hide(c.id)} className="rounded-lg border border-gray-300 px-3 py-1.5 text-xs font-bold text-gray-700 hover:border-brand-red hover:text-brand-red dark:border-gray-600 dark:text-gray-300">লুকান</button>}
                                        {c.status === 'trash' ? (
                                            <>
                                                <button onClick={() => restoreC(c.id)} className="rounded-lg bg-[#1F7A3D] px-3 py-1.5 text-xs font-bold text-white">ফিরিয়ে আনুন</button>
                                                <button onClick={() => purgeC(c.id)} className="rounded-lg border border-brand-red px-3 py-1.5 text-xs font-bold text-brand-red hover:bg-red-50">স্থায়ীভাবে মুছুন</button>
                                            </>
                                        ) : (
                                            <button onClick={() => del(c.id)} className="ml-auto rounded-lg border border-gray-300 px-3 py-1.5 text-xs font-bold text-brand-red hover:bg-red-50 dark:border-gray-600">ট্র্যাশে নিন</button>
                                        )}
                                    </div>
                                    {replyTo === c.id && (
                                        <div className="mt-3 flex gap-2">
                                            <input autoFocus value={reply} onChange={(e) => setReply(e.target.value)} placeholder="সম্পাদকের উত্তর…" className={MC_INPUT} />
                                            <button onClick={() => sendReply(c)} className="rounded-lg bg-brand-red px-4 py-2 text-sm font-bold text-white">পাঠান</button>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                        {!rows.length && <p className="rounded-lg border border-dashed border-gray-300 py-12 text-center text-sm text-gray-500 dark:border-gray-700">এই ঘরানিতে কোনো মন্তব্য নেই।</p>}
                    </div>
                </div>
            );
        };

        // ==================================================================
        //  আর্কাইভ ও ট্র্যাশ (১৩.৪)
        // ==================================================================
        const MC_TRASH_KINDS = [['news', 'সংবাদ'], ['videos', 'ভিডিও'], ['announcements', 'ঘোষণা'], ['albums', 'অ্যালবাম'], ['categories', 'বিভাগ'], ['comments', 'মন্তব্য']];
        const McAdminTrash = () => {
            const db = useMcStore();
            const [kind, setKind] = React.useState('news');
            const titleOf = (x) => x.title || x.name || '—';
            const rows = (db[kind] || []).filter(x => x.status === 'trash' || x.trashedAt);
            const restore = (x) => {
                MC_STORE.mutate('update:' + kind + ':restore', (d) => {
                    const y = d[kind].find(z => String(z.id) === String(x.id));
                    y.status = y.prevStatus || (kind === 'news' ? 'draft' : kind === 'categories' ? 'show' : 'published');
                    delete y.prevStatus; y.trashedAt = '';
                });
                mcToast('“' + titleOf(x) + '” ফিরিয়ে আনা হয়েছে');
            };
            const purge = (x) => {
                MC_STORE.mutate('delete:' + kind + ':' + titleOf(x), (d) => { d[kind] = d[kind].filter(z => String(z.id) !== String(x.id)); if (kind === 'news') d.revisions = (d.revisions || []).filter(r => String(r.newsId) !== String(x.id)); });
                mcToast('স্থায়ীভাবে মুছে ফেলা হয়েছে', 'err');
            };
            const counts = MC_TRASH_KINDS.map(([k]) => (db[k] || []).filter(x => x.status === 'trash' || x.trashedAt).length);
            return (
                <div className="space-y-4">
                    <div><h2 className="font-serif text-2xl font-bold text-gray-900 dark:text-white">রিসাইকল বিন</h2>
                        <p className="text-xs text-gray-500">মুছে ফেলার আগে প্রতিটি আইটেম এখানে আসে — ফেরানো বা স্থায়ীভাবে মুছতে হবে (২৫ নম্বর)</p></div>
                    <div className="flex flex-wrap gap-1.5">
                        {MC_TRASH_KINDS.map(([k, l], i2) => (
                            <button key={k} onClick={() => setKind(k)} className={`rounded-full px-3.5 py-1.5 text-[13px] font-bold ${kind === k ? 'bg-brand-red text-white' : 'border border-gray-300 text-gray-600 hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300'}`} aria-pressed={kind === k}>{l} <span className="opacity-70">{mcBn(counts[i2])}</span></button>
                        ))}
                    </div>
                    {rows.length ? (
                        <ul className="space-y-2">
                            {rows.map(x => (
                                <li key={x.id} className="flex flex-wrap items-center gap-3 rounded-lg border border-gray-200 bg-white p-3 text-sm dark:border-gray-700 dark:bg-gray-800">
                                    <i className="ph ph-trash-simple text-gray-400"></i>
                                    <span className="min-w-0 flex-1 truncate font-semibold text-gray-800 dark:text-gray-200">{titleOf(x)}</span>
                                    {x.trashedAt && <span className="text-[11px] text-gray-500">ট্র্যাশে: {timeAgo(x.trashedAt)}</span>}
                                    <span className="rounded bg-gray-100 px-2 py-0.5 text-[11px] font-bold text-gray-600 dark:bg-gray-700 dark:text-gray-300">{(api.getSettings().statuses || {})[x.prevStatus || x.status] || x.prevStatus || x.status}</span>
                                    <button onClick={() => restore(x)} className="rounded-lg bg-[#1F7A3D] px-3 py-1.5 text-xs font-bold text-white hover:bg-[#166033]"><i className="ph ph-arrow-counter-clockwise mr-1"></i>ফিরিয়ে আনুন</button>
                                    <button onClick={() => purge(x)} className="rounded-lg border border-brand-red px-3 py-1.5 text-xs font-bold text-brand-red hover:bg-red-50">স্থায়ীভাবে মুছুন</button>
                                </li>
                            ))}
                        </ul>
                    ) : (
                        <p className="rounded-lg border border-dashed border-gray-300 py-14 text-center text-sm text-gray-500 dark:border-gray-700">এই ঘরানির ট্র্যাশ খালি।</p>
                    )}
                </div>
            );
        };

        // ==================================================================
        //  সাইট / SEO সেটিংস — কনফিগ-চালিত ফর্ম
        // ==================================================================
        const McSettingsForm = ({ title, desc, bucket, fields, note }) => {
            const db = useMcStore();
            const [draft, setDraft] = React.useState(() => ({ ...(db[bucket] || {}) }));
            React.useEffect(() => { setDraft({ ...(db[bucket] || {}) }); }, [bucket, JSON.stringify(db[bucket])]);
            const dirty = JSON.stringify(draft) !== JSON.stringify(db[bucket] || {});
            const save = () => { MC_STORE.mutate('update:' + bucket + ':সেটিংস', (d) => { Object.assign(d[bucket], draft); }); mcToast('সেটিংস সংরক্ষিত হয়েছে'); };
            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-end justify-between gap-3">
                        <div><h2 className="font-serif text-2xl font-bold text-gray-900 dark:text-white">{title}</h2>{desc && <p className="text-xs text-gray-500">{desc}</p>}</div>
                        <div className="flex items-center gap-2">
                            {dirty && <span className="text-[11px] font-bold text-amber-600">অসংরক্ষিত পরিবর্তন</span>}
                            <button onClick={save} disabled={!dirty} className="rounded-lg bg-brand-red px-4 py-2 text-sm font-bold text-white hover:bg-red-700 disabled:opacity-40">সংরক্ষণ করুন</button>
                        </div>
                    </div>
                    <McPanel>
                        <div className="grid grid-cols-1 gap-3 md:grid-cols-2">
                            {fields.map(f => (
                                <div key={f.key} className={f.wide ? 'md:col-span-2' : ''}>
                                    <McField label={f.label} hint={f.hint}>
                                        {f.type === 'textarea' ? <textarea rows={f.rows || 3} className={MC_INPUT} value={draft[f.key] || ''} onChange={(e) => setDraft({ ...draft, [f.key]: e.target.value })} />
                                            : f.type === 'switch' ? <label className="flex items-center gap-2 pt-1 text-sm font-semibold text-gray-700 dark:text-gray-300"><input type="checkbox" className="h-4 w-4 rounded border-gray-300 text-brand-red" checked={!!draft[f.key]} onChange={(e) => setDraft({ ...draft, [f.key]: e.target.checked })} /> {f.on || 'সক্রিয়'}</label>
                                                : <input className={MC_INPUT} value={draft[f.key] || ''} onChange={(e) => setDraft({ ...draft, [f.key]: e.target.value })} placeholder={f.ph} />}
                                    </McField>
                                    {f.preview && draft[f.key] ? <div className="mt-2 overflow-hidden rounded border border-gray-200 bg-gray-50 p-2 dark:border-gray-700 dark:bg-gray-900"><img src={draft[f.key]} alt="" onError={imgFallback} className="max-h-16 object-contain" /></div> : null}
                                </div>
                            ))}
                        </div>
                        {note && <p className="mt-4 rounded-lg bg-gray-50 p-3 text-[11px] leading-relaxed text-gray-500 dark:bg-gray-900/50">{note}</p>}
                    </McPanel>
                </div>
            );
        };

        // ==================================================================
        //  হোমপেজ সেকশন ম্যানেজার (১৭)
        // ==================================================================
        const McAdminHomepage = () => {
            const db = useMcStore();
            const hp = db.homepage;
            const names = { latestFull: 'সর্বশেষ প্রকাশিত সংবাদ (পূর্ণ বিবরণ)', videos: 'ভিডিও গ্যালারি', announcements: 'গুরুত্বপূর্ণ ঘোষণা', mostRead: 'সর্বাধিক পঠিত', ads: 'বিজ্ঞাপন স্লট (টপ/মিডল/সাইড/ফুটার)' };
            const dragIx = React.useRef(null);
            const dropIx = (to) => { const from = dragIx.current; dragIx.current = null; if (from === null || from === to) return; MC_STORE.mutate('update:homepage:ক্রম', (d) => { const a = d.homepage.order; const [m] = a.splice(from, 1); a.splice(to, 0, m); }); mcToast('সেকশনের ক্রম বদলেছে (ড্র্যাগ)'); };
            const labelOf = (id) => names[id] || (api.getCategory(id) || {}).name || id;
            const move = (i, dir) => MC_STORE.mutate('update:homepage:ক্রম', (d) => { const a = d.homepage.order; const j = i + dir; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; });
            const hide = (id) => MC_STORE.mutate('update:homepage:লুকানো', (d) => { const h = d.homepage.hidden || []; d.homepage.hidden = h.includes(id) ? h.filter(x => x !== id) : [...h, id]; });
            return (
                <div className="space-y-4">
                    <div><h2 className="font-serif text-2xl font-bold text-gray-900 dark:text-white">হোমপেজ সেকশন</h2><p className="text-xs text-gray-500">কোন বিভাগ আগে দেখাবে, কোনটি লুকানো — ড্র্যাগ/অ্যারো দিয়ে ক্রম বদলান</p></div>
                    <McPanel title="ক্রম" actions={<div className="flex items-center gap-2 text-xs"><span className="font-bold text-gray-600 dark:text-gray-300">প্রতি বিভাগে কার্ড:</span>
                        <select className="rounded border border-gray-300 px-2 py-1 text-xs dark:border-gray-600 dark:bg-gray-900 dark:text-white" value={hp.perCategory} onChange={(e) => MC_STORE.mutate('update:homepage:প্রতি-বিভাগ', (d) => { d.homepage.perCategory = Number(e.target.value); })}>{[1, 2, 3, 4].map(n => <option key={n} value={n}>{mcBn(n)}</option>)}</select></div>}>
                        <ul className="divide-y divide-gray-100 dark:divide-gray-700">
                            {hp.order.map((id, i) => (
                                <li key={id} draggable onDragStart={() => { dragIx.current = i; }} onDragOver={(e) => e.preventDefault()} onDrop={() => dropIx(i)} title="ধরে টেনে ক্রম বদলান (২৫ নম্বর)" className={`flex cursor-grab items-center gap-3 py-2.5 active:cursor-grabbing ${ (hp.hidden || []).includes(id) ? 'opacity-50' : ''}`}>
                                    <span className="w-6 text-center font-serif text-lg font-black text-gray-300 dark:text-gray-600">{mcBn(i + 1)}</span>
                                    <i className="ph ph-hand-grabbing text-gray-400"></i>
                                    <span className="flex-1 font-semibold text-gray-800 dark:text-gray-200">{labelOf(id)}</span>
                                    <code className="text-[11px] text-gray-400">{id}</code>
                                    <span className="flex gap-1.5">
                                        <button className={MC_ICON_BTN} onClick={() => move(i, -1)} disabled={i === 0} aria-label="উপরে"><i className="ph ph-arrow-up"></i></button>
                                        <button className={MC_ICON_BTN} onClick={() => move(i, 1)} disabled={i === hp.order.length - 1} aria-label="নিচে"><i className="ph ph-arrow-down"></i></button>
                                        <button className={MC_ICON_BTN} onClick={() => hide(id)} aria-label="লুকান"><i className={`ph ${(hp.hidden || []).includes(id) ? 'ph-eye-slash' : 'ph-eye'}`}></i></button>
                                    </span>
                                </li>
                            ))}
                        </ul>
                        <p className="mt-4 text-[11px] text-gray-500">নতুন বিভাগ যোগ করলে সেটি স্বয়ংক্রিয়ভাবে তালিকায় চলে আসে (১৬ নম্বরের সঙ্গে যুক্ত)।</p>
                    </McPanel>
                </div>
            );
        };

        // ==================================================================
        //  মেনু ম্যানেজার (১৭.২)
        // ==================================================================
        const McAdminMenus = () => {
            const db = useMcStore();
            const [slot, setSlot] = React.useState('primary');
            const items = db.menus[slot] || [];
            const move = (i, dir) => MC_STORE.mutate('update:menus:ক্রম', (d) => { const a = d.menus[slot]; const j = i + dir; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; a.forEach((x, k) => { x.order = k; }); });
            const patch = (it, o) => MC_STORE.mutate('update:menus:' + it.label, (d) => { const x = d.menus[slot].find(y => y.id === it.id); Object.assign(x, o); });
            const add = () => MC_STORE.mutate('create:menus:নতুন আইটেম', (d) => { d.menus[slot].push({ id: mcUid('mn'), label: 'নতুন লিঙ্ক', type: 'page', target: 'about', status: 'show', order: d.menus[slot].length, icon: 'ph-link' }); });
            const del = (it) => MC_STORE.mutate('delete:menus:' + it.label, (d) => { d.menus[slot] = d.menus[slot].filter(x => x.id !== it.id); d.menus[slot].forEach((x, k) => { x.order = k; }); });
            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-end justify-between gap-3">
                        <div><h2 className="font-serif text-2xl font-bold text-gray-900 dark:text-white">মেনু ম্যানেজার</h2><p className="text-xs text-gray-500">হেডার মেনু, ড্রয়ার ও “আরও” — তিনটি স্লট আলাদা আলাদা করে সাজানো যায়</p></div>
                        <div className="flex items-center gap-1.5">
                            {[['primary', 'হেডার মেনু'], ['drawer', 'ড্রয়ার মেনু'], ['more', 'আরও তালিকা']].map(([k, l]) => <button key={k} onClick={() => setSlot(k)} className={`rounded-full px-3 py-1.5 text-xs font-bold ${slot === k ? 'bg-brand-red text-white' : 'border border-gray-300 text-gray-600 dark:border-gray-600 dark:text-gray-300'}`}>{l} ({mcBn((db.menus[k] || []).length)})</button>)}
                            <button onClick={add} className="rounded-lg bg-[#1F7A3D] px-3 py-1.5 text-xs font-bold text-white">+ আইটেম</button>
                        </div>
                    </div>
                    <McPanel desc={slot === 'primary' ? 'হেডারে ৮টির বেশি আইটেম দেখানো হয় না (বাকিগুলো “আরও”-তে যায়) — এটি ডিজাইনগত সীমা, Laravel-এ max_items সেটিংসে রাখা ভালো।' : 'ড্রয়ার ও “আরও” তালিকা বর্তমান মেনু ড্রয়ারের ক্রমের সঙ্গে মেলে; নতুন আইটেম যোগ করলে সেটি ডেমোতে এখানেই জমা হয়।'}>
                        <ul className="divide-y divide-gray-100 dark:divide-gray-700">
                            {items.map((it, i) => (
                                <li key={it.id} className="flex flex-wrap items-center gap-3 py-2">
                                    <span className="w-6 text-center font-serif text-lg font-black text-gray-300">{mcBn(i + 1)}</span>
                                    <input value={it.label} onChange={(e) => patch(it, { label: e.target.value })} className="min-w-[10ch] flex-1 rounded border border-transparent bg-transparent px-1 text-sm font-semibold text-gray-800 hover:border-gray-300 focus:border-brand-red focus:outline-none dark:text-gray-200" />
                                    <select value={it.type} onChange={(e) => patch(it, { type: e.target.value })} className="rounded border border-gray-300 px-2 py-1 text-xs dark:border-gray-600 dark:bg-gray-900 dark:text-white">
                                        <option value="category">বিভাগ</option><option value="page">পেজ</option><option value="url">বাইরের লিঙ্ক</option>
                                    </select>
