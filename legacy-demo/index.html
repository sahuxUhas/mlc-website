                                    <input value={it.target} onChange={(e) => patch(it, { target: e.target.value })} className="w-40 rounded border border-gray-300 px-2 py-1 text-[11px] text-gray-500 dark:border-gray-600 dark:bg-gray-900" aria-label="লক্ষ্য" />
                                    <button onClick={() => patch(it, { status: it.status === 'hide' ? 'show' : 'hide' })} className={`rounded-lg border px-2.5 py-1 text-[11px] font-bold ${it.status === 'hide' ? 'border-gray-300 text-gray-500 dark:border-gray-600' : 'border-[#1F7A3D] text-[#1F7A3D]'}`}>{it.status === 'hide' ? 'লুকানো' : 'দৃশ্যমান'}</button>
                                    <span className="flex gap-1.5">
                                        <button className={MC_ICON_BTN} onClick={() => move(i, -1)} aria-label="উপরে"><i className="ph ph-arrow-up"></i></button>
                                        <button className={MC_ICON_BTN} onClick={() => move(i, 1)} aria-label="নিচে"><i className="ph ph-arrow-down"></i></button>
                                        <button className={MC_ICON_BTN} onClick={() => del(it)} aria-label="মুছুন"><i className="ph ph-trash"></i></button>
                                    </span>
                                </li>
                            ))}
                            {!items.length && <li className="py-8 text-center text-sm text-gray-500">এই স্লটে কোনো আইটেম নেই।</li>}
                        </ul>
                    </McPanel>
                </div>
            );
        };

        // ==================================================================
        //  ইউজার, রোল ও পারমিশন (২৬) + নিউজলেটার + সিকিউরিটি + লগ + অ্যানালিটিক্স
        // ==================================================================
        const McAdminUsers = () => {
            const db = useMcStore();
            const [tab, setTab] = React.useState('users');
            const setRole = (u, role) => MC_STORE.mutate('update:users:' + u.name, (d) => { const x = d.users.find(y => y.id === u.id); x.role = role; });
            const setStatus = (u) => MC_STORE.mutate('update:users:' + u.name, (d) => { const x = d.users.find(y => y.id === u.id); x.status = x.status === 'active' ? 'suspended' : 'active'; });
            const togglePerm = (role, perm) => MC_STORE.mutate('update:roles:' + role.name, (d) => {
                const r = d.roles.find(x => x.id === role.id);
                if (r.perms.includes('*')) r.perms = ['news.view', 'news.create'];

            const db = useMcStore();

            const [newName, setNewName] = React.useState('');
            const [prog, setProg] = React.useState(null);      // { pct, name, err }

            const rows = (db.media || []).filter(m => !q || JSON.stringify(m).toLowerCase().includes(q.toLowerCase()));
            const push = (o) => MC_STORE.mutate('create:media:' + (o.title || 'ছবি'), (d) => { d.media = [{ id: mcUid('md'), at: mcNowISO(), used: 0, type: 'image', ...o }, ...(d.media || [])]; });
            const onFiles = (files) => {
                const list = Array.from(files || []);
                if (!list.length) return;
                let ok = 0, bad = [];
                list.forEach((f, k) => {
                    const ext = String(f.name || '').split('.').pop().toLowerCase();
                    if (!MC_ALLOWED_IMG.includes(ext) || f.size > 3 * 1024 * 1024) { bad.push(f.name + ' (' + (MC_ALLOWED_IMG.includes(ext) ? '৩ MB-এ বেশি' : ext) + ')'); return; }
                    ok++;
                    setProg({ pct: Math.round(((k + 1) / list.length) * 100), name: f.name });
                    const reader = new FileReader();
                    reader.onload = () => push({ src: String(reader.result).slice(0, 40000), title: f.name.replace(/\.[^.]+$/, ''), alt: f.name, credit: 'আপলোড (ডেমো)', folder: 'ছবি', fileName: f.name, sizeKb: Math.round(f.size / 1024), width: 0, height: 0, demo: true });
                    reader.readAsDataURL(f);
                });
                setTimeout(() => { setProg(null); mcToast(ok ? mcBn(ok) + ' টি ছবি আপলোড হয়েছে (ডেমো স্টোরে)' : 'কোনো ফাইল আপলোড হয়নি', bad.length ? 'err' : undefined); }, 520);

                                                                >
                                                                    বাতিল
                                                                </button>
                                                            )}
                                                            <button
                                                                onClick={() => handleDeleteReq(req.id)}
                                                                className="px-2 py-1 text-gray-400 hover:text-red-600 text-xs"
                                                                title="মুছে ফেলুন"
                                                            >
                                                                <i className="ph ph-trash text-sm"></i>
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    ) : (
                        <McResource collection="advertisements" title="বিজ্ঞাপন ম্যানেজার" createLabel="নতুন বিজ্ঞাপন" searchIn={['name', 'position']}
                            desc="স্লটভিত্তিক বিজ্ঞাপন — মেয়াদ, সাইজ ও স্ট্যাটাসসহ (রেভিনিউ ট্র্যাকিং প্রস্তুত)"
                            filters={[{ v: 'active', l: 'চালু' }, { v: 'paused', l: 'বিরতি' }, { v: 'draft', l: 'খসড়া' }]}
                            columns={[

                                { key: 'impressions', label: 'ইমপ্রেশন / ক্লিক', render: (a) => <span className="whitespace-nowrap">{mcBn((a.impressions || 0).toLocaleString('bn-BD'))} / {mcBn(a.clicks || 0)}</span> },
                                { key: 'status', label: 'অবস্থা', render: (a) => <McTag tone={a.status === 'active' ? 'green' : a.status === 'paused' ? 'amber' : 'gray'}>{mcStatusMeta[a.status] ? mcStatusMeta[a.status][0] : a.status}</McTag> },
                            ]}
                            fields={[
                                { key: 'name', label: 'বিজ্ঞাপনের নাম / বিজ্ঞাপনদাতা', required: true, wide: true },
                                { key: 'position', label: 'স্লট', type: 'select', options: ['top-header', 'middle', 'sidebar', 'in-article', 'mobile-banner', 'footer', 'home-list'] },
                                { key: 'size', label: 'সাইজ', def: '728×90' },
                                { key: 'type', label: 'ধরন', type: 'select', options: ['image', 'html'] },
                                { key: 'src', label: 'ছবির URL', wide: true },
                                { key: 'html', label: 'HTML / AdSense কোড', type: 'textarea', wide: true },
                                { key: 'url', label: 'ল্যান্ডিং লিঙ্ক', wide: true },
                                { key: 'startAt', label: 'শুরু', type: 'date' },
                                { key: 'endAt', label: 'শেষ', type: 'date' },
                                { key: 'status', label: 'অবস্থা', type: 'select', options: [['active', 'চালু'], ['paused', 'বিরতি'], ['draft', 'খসড়া']] },
                            ]} />
                    )}
                </div>
            );
        };

        const McAdminPages = () => (
            <McResource collection="pages" title="স্ট্যাটিক পেজ" createLabel="নতুন পেজ" searchIn={['title', 'body']}
                desc="about / contact / advertise / privacy — #/{'{'}slug{'}'} ঠিকানায় খোলে"
                columns={[
                    { key: 'title', label: 'শিরোনাম' },
                    { key: 'slug', label: 'স্লাগ', render: (p) => <code className="text-[11px] text-gray-500">#/{p.slug}</code> },
                    { key: 'updatedAt', label: 'হালনাগাদ', render: (p) => <span className="text-[12px] text-gray-500">{p.updatedAt ? timeAgo(p.updatedAt) : '—'}</span> },
                    { key: 'status', label: 'অবস্থা', render: (p) => <McTag tone={p.status === 'published' ? 'green' : 'gray'}>{mcStatusMeta[p.status] ? mcStatusMeta[p.status][0] : p.status}</McTag> },
                ]}
                fields={[
                    { key: 'title', label: 'পেজের শিরোনাম', required: true },
                    { key: 'slug', label: 'স্লাগ' },
                    { key: 'body', label: 'লেখা', type: 'textarea', rows: 8, wide: true },
                    { key: 'status', label: 'অবস্থা', type: 'select', options: [['published', 'প্রকাশিত'], ['draft', 'খসড়া']] },
                ]} />
        );

        // ==================================================================
        //  রাউটার + পারমিশন গেট (২৬)
        // ==================================================================
        // ================================================================
        //  ২২/২৪ নম্বর: ট্যাগ ম্যানেজার (সংবাদ থেকে স্বয়ংক্রিয়ভাবে গুনে নেওয়া)
        // ================================================================
        const McAdminTags = () => {
            const db = useMcStore();
            const [add, setAdd] = React.useState('');
            const [edit, setEdit] = React.useState(null);
            const [rename, setRename] = React.useState('');
            const counts = {};
            db.news.forEach(n => (n.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
            const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
            const renameTag = (from) => {
                const to = String(rename || '').trim();
                if (!to || to === from) { setEdit(null); return; }
                MC_STORE.mutate('update:tags:' + from, (d) => {
                    d.news.forEach(n => { if (Array.isArray(n.tags) && n.tags.includes(from)) n.tags = Array.from(new Set(n.tags.map(t => t === from ? to : t))); });
                });
                setEdit(null); setRename(''); mcToast('ট্যাগের নাম বদলেছে: ' + from + ' → ' + to);
            };
            const dropTag = (t) => {
                MC_STORE.mutate('delete:tags:' + t, (d) => { d.news.forEach(n => { if (Array.isArray(n.tags)) n.tags = n.tags.filter(x => x !== t); }); });
                mcToast('“' + t + '” সব সংবাদ থেকে সরানো হয়েছে');
            };
            const attach = (e) => {
                e.preventDefault();
                const t = String(add || '').trim(); if (!t) return;
                MC_STORE.mutate('create:tags:' + t, (d) => { d.news.forEach(n => { if (n.status === 'published' && !Array.isArray(n.tags)) n.tags = []; }); d.news[0].tags = Array.from(new Set([...(d.news[0].tags || []), t])); });
                setAdd(''); mcToast('“' + t + '” সর্বশেষ সংবাদে যুক্ত হয়েছে');
            };
            return (
                <div className="space-y-4">
                    <div><h2 className="font-serif text-2xl font-bold text-gray-900 dark:text-white">ট্যাগ ম্যানেজার</h2>
                        <p className="text-xs text-gray-500">সংবাদের ট্যাগ এখান থেকে রিনেম/সরানো যায় — নিউজ পেজের ট্যাগ ও সম্পর্কিত সংবাদ এ থেকেই বদলায়</p></div>
                    <form onSubmit={attach} className="flex flex-wrap items-center gap-2">
                        <input value={add} onChange={(e) => setAdd(e.target.value)} placeholder="নতুন ট্যাগ (সর্বশেষ সংবাদে যুক্ত হবে)" className="w-64 rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-900 dark:text-white" />
                        <button className="rounded-lg bg-[#1F7A3D] px-3.5 py-2 text-sm font-bold text-white hover:bg-[#166033]">যোগ করুন</button>
                    </form>
                    <McPanel title={'ট্যাগ (' + mcBn(tags.length) + ')'} desc="সংখ্যা = কয়টি সংবাদে ব্যবহৃত">
                        <div className="flex flex-wrap gap-2">
                            {tags.map(t => (
                                <span key={t} className="flex items-center gap-1 rounded-full border border-gray-200 bg-white px-2.5 py-1 text-[12px] font-semibold text-gray-700 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200">
                                    {edit === t ? (
                                        <>
                                            <input autoFocus value={rename} onChange={(e) => setRename(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') renameTag(t); }} className="w-28 rounded border border-gray-300 px-1 text-[12px] dark:bg-gray-800" />
                                            <button type="button" aria-label="নাম সংরক্ষণ করুন" onClick={() => renameTag(t)} className="text-[#1F7A3D]"><i className="ph ph-check"></i></button>
                                            <button type="button" onClick={() => setEdit(null)} className="text-gray-400"><i className="ph ph-x"></i></button>
                                        </>
                                    ) : (
                                        <>
                                            #{t} <span className="text-gray-400">{mcBn(counts[t])}</span>
                                            <button type="button" title="নাম বদলান" aria-label="নাম বদলান" onClick={() => { setEdit(t); setRename(t); }} className="text-gray-400 hover:text-brand-red"><i className="ph ph-pencil-simple"></i></button>
                                            <button type="button" title="সরান" aria-label="সরান" onClick={() => dropTag(t)} className="text-gray-400 hover:text-brand-red"><i className="ph ph-trash"></i></button>
                                        </>
                                    )}
                                </span>
                            ))}
                            {!tags.length && <p className="text-sm text-gray-500">কোনো ট্যাগ নেই।</p>}
                        </div>
                    </McPanel>
                </div>
            );
        };

        // ================================================================
        //  ১২ নম্বর: রিপোর্টার/লেখক — নাম, ছবি, বায়ো
        // ================================================================
        const McAdminReporters = () => (
            <McResource collection="reporters" title="রিপোর্টার ও লেখক" createLabel="নতুন রিপোর্টার" searchIn={['name', 'role', 'beat']}
                desc="সংবাদ এডিটরের ‘লেখক’ ড্রপডাউন ও নিউজ পেজের বাইলাইন এখান থেকেই আসে"
                columns={[
                    { key: 'photo', label: 'ছবি', render: (r) => (r.photo ? <img src={r.photo} alt="" onError={imgFallback} className="h-10 w-10 rounded-full object-cover" loading="lazy" /> : <span className="flex h-10 w-10 items-center justify-center rounded-full bg-gray-200 text-[11px] font-bold text-gray-600 dark:bg-gray-700 dark:text-gray-300">{String(r.name || '?').slice(0, 2)}</span>) },
                    { key: 'name', label: 'নাম' },
                    { key: 'role', label: 'পদবি' },
                    { key: 'beat', label: 'বিট' },
                    { key: 'bio', label: 'বায়ো', render: (r) => <span className="line-clamp-1 text-[12px] text-gray-500">{r.bio || '—'}</span> },
                ]}
                fields={[
                    { key: 'name', label: 'নাম', required: true }, { key: 'role', label: 'পদবি', def: 'Contributing Reporter' },
                    { key: 'beat', label: 'বিট / এলাকা' }, { key: 'photo', label: 'ছবির URL', preview: true, wide: true },
                    { key: 'bio', label: 'সংক্ষিপ্ত বায়ো', type: 'textarea', wide: true },
                    { key: 'email', label: 'ইমেইল' }, { key: 'phone', label: 'ফোন' },
                    { key: 'status', label: 'অবস্থা', type: 'select', options: ['active', 'suspended'], def: 'active' },
                ]} />
        );

        const MC_ADMIN_PERM = { news: 'news.view', tags: 'categories.manage', reporters: 'users.manage', media: 'media.upload', videos: 'news.create', ads: 'ads.manage', comments: 'comments.moderate', users: 'users.manage', settings: 'settings.manage', seo: 'settings.manage', security: 'settings.manage', activity: 'settings.manage', analytics: 'news.view', homepage: 'categories.manage', menus: 'categories.manage', pages: 'news.create', categories: 'categories.manage', newsletter: 'news.view', trash: 'news.delete' };

        const McAdminDenied = ({ name }) => (
            <div className="rounded-lg border border-dashed border-gray-300 py-16 text-center dark:border-gray-700">
                <i className="ph ph-shield-warning text-4xl text-amber-500"></i>
                <h2 className="mt-3 font-serif text-xl font-bold text-gray-900 dark:text-white">এই মডিউলে আপনার অনুমতি নেই</h2>
                <p className="mt-1 text-sm text-gray-500">রোল: <b>{api.me().role}</b> · মডিউল: {name} — super-admin থেকে পারমিশন দিন (২৬ নম্বর)।</p>
            </div>
        );

        
        // ==================================================================
        //  পাঠকের প্রতিবেদন ব্যবস্থাপনা (Review, Edit, Approve, Reject, Publish)
        // ==================================================================
        const McAdminReports = () => {
            const db = useMcStore();
            const reports = db.reports || [];
            const [filter, setFilter] = React.useState('all');
            const [activeReport, setActiveReport] = React.useState(null);
            const [editForm, setEditForm] = React.useState(null);

            const filtered = reports.filter(r => {
                if (filter === 'all') return true;
                return r.status === filter;
            });

            const counts = {
                all: reports.length,
                pending: reports.filter(r => r.status === 'pending').length,
                approved: reports.filter(r => r.status === 'approved').length,
                published: reports.filter(r => r.status === 'published').length,
                rejected: reports.filter(r => r.status === 'rejected').length
            };

            const openEdit = (rep) => {
                setActiveReport(rep);
                setEditForm({
                    title: rep.title || '',
                    content: rep.content || '',
                    location: rep.location || 'মহালছড়ি',
                    categoryId: 'mahalchhari',
                    image: rep.image || '',
                    status: rep.status || 'pending'
                });
            };

            const saveEdit = () => {
                if (!activeReport || !editForm) return;
                api.updateReport(activeReport.id, editForm);
                mcToast('প্রতিবেদনটি সফলভাবে আপডেট করা হয়েছে');
                setActiveReport(null);
            };

            const handleApprove = (id) => {
                api.updateReport(id, { status: 'approved' });
                mcToast('প্রতিবেদনটি অনুমোদিত হয়েছে', 'ok');
            };

            const handleReject = (id) => {
                api.updateReport(id, { status: 'rejected' });
                mcToast('প্রতিবেদনটি বাতিল করা হয়েছে', 'warn');
            };

            const handleDelete = (id) => {
                if (confirm('আপনি কি নিশ্চিতভাবে এই প্রতিবেদনটি মুছে ফেলতে চান?')) {
                    api.deleteReport(id);
                    mcToast('প্রতিবেদনটি মুছে ফেলা হয়েছে', 'warn');
                }
            };

            const handlePublish = (rep) => {
                api.publishReportAsNews(rep.id, {
                    title: editForm?.title || rep.title,
                    content: editForm?.content || rep.content,
                    image: editForm?.image || rep.image,
                    categoryId: editForm?.categoryId || 'mahalchhari'
                });
                mcToast('প্রতিবেদনটি সফলভাবে নিউজ পোর্টালে প্রকাশিত হয়েছে!', 'ok');
                setActiveReport(null);
            };

            const statusBadge = (st) => {
                switch (st) {
                    case 'pending': return <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-950/50 dark:text-amber-300">অপেক্ষমাণ</span>;
                    case 'approved': return <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-blue-100 text-blue-800 dark:bg-blue-950/50 dark:text-blue-300">অনুমোদিত</span>;
                    case 'published': return <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/50 dark:text-emerald-300">প্রকাশিত</span>;
                    case 'rejected': return <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-red-100 text-red-800 dark:bg-red-950/50 dark:text-red-300">বাতিল</span>;
                    default: return null;
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <h1 className="text-2xl font-serif font-bold text-gray-900 dark:text-white">পাঠকের প্রতিবেদন ও রিভিউ</h1>
                            <p className="text-xs text-gray-500 dark:text-gray-400">ওয়েবসাইট ভিজিটরদের পাঠানো সংবাদ পর্যালোচনা, অনুমোদন ও সরাসরি প্রকাশ</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                        <button
                            onClick={() => setFilter('all')}
                            className={`p-3.5 rounded-xl border text-left transition-all ${filter === 'all' ? 'border-brand-red bg-red-50/50 dark:bg-red-950/20 shadow-sm' : 'border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800'}`}
                        >
                            <span className="text-xs text-gray-500 dark:text-gray-400 block font-medium">মোট প্রতিবেদন</span>
                            <span className="text-xl font-bold text-gray-900 dark:text-white">{toBanglaNum(counts.all)}</span>
                        </button>
                        <button
                            onClick={() => setFilter('pending')}
                            className={`p-3.5 rounded-xl border text-left transition-all ${filter === 'pending' ? 'border-amber-500 bg-amber-50/50 dark:bg-amber-950/20 shadow-sm' : 'border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800'}`}
                        >
                            <span className="text-xs text-amber-600 dark:text-amber-400 block font-bold">অপেক্ষমাণ (Pending)</span>
                            <span className="text-xl font-bold text-amber-700 dark:text-amber-300">{toBanglaNum(counts.pending)}</span>
                        </button>
                        <button
                            onClick={() => setFilter('approved')}
                            className={`p-3.5 rounded-xl border text-left transition-all ${filter === 'approved' ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-950/20 shadow-sm' : 'border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800'}`}
                        >
                            <span className="text-xs text-blue-600 dark:text-blue-400 block font-bold">অনুমোদিত (Approved)</span>
                            <span className="text-xl font-bold text-blue-700 dark:text-blue-300">{toBanglaNum(counts.approved)}</span>
                        </button>
                        <button
                            onClick={() => setFilter('published')}
                            className={`p-3.5 rounded-xl border text-left transition-all ${filter === 'published' ? 'border-emerald-500 bg-emerald-50/50 dark:bg-emerald-950/20 shadow-sm' : 'border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800'}`}
                        >
                            <span className="text-xs text-emerald-600 dark:text-emerald-400 block font-bold">প্রকাশিত (Live)</span>
                            <span className="text-xl font-bold text-emerald-700 dark:text-emerald-300">{toBanglaNum(counts.published)}</span>
                        </button>
                        <button
                            onClick={() => setFilter('rejected')}
                            className={`p-3.5 rounded-xl border text-left transition-all ${filter === 'rejected' ? 'border-red-500 bg-red-50/50 dark:bg-red-950/20 shadow-sm' : 'border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800'}`}
                        >
                            <span className="text-xs text-red-600 dark:text-red-400 block font-bold">বাতিল (Rejected)</span>
                            <span className="text-xl font-bold text-red-700 dark:text-red-300">{toBanglaNum(counts.rejected)}</span>
                        </button>
                    </div>

                    {filtered.length === 0 ? (
                        <div className="p-12 text-center rounded-2xl border border-dashed border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800">
                            <i className="ph ph-newspaper text-4xl text-gray-400 mb-2"></i>
                            <p className="text-sm font-semibold text-gray-600 dark:text-gray-300">এই বিভাগে কোনো প্রতিবেদন নেই।</p>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {filtered.map(rep => (
                                <div key={rep.id} className="p-4 sm:p-5 rounded-2xl border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div className="flex items-start gap-4 flex-1">
                                        {rep.image ? (
                                            <img src={rep.image} alt="Report" className="h-16 w-20 rounded-xl object-cover shrink-0 border dark:border-gray-700" />
                                        ) : (
                                            <div className="h-16 w-20 rounded-xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center shrink-0 text-gray-400">
                                                <i className="ph ph-image text-2xl"></i>
                                            </div>
                                        )}
                                        <div className="space-y-1">
                                            <div className="flex flex-wrap items-center gap-2">
                                                {statusBadge(rep.status)}
                                                <span className="text-xs font-semibold text-gray-500 dark:text-gray-400">
                                                    <i className="ph ph-map-pin mr-0.5"></i> {rep.location || 'মহালছড়ি'}
                                                </span>
                                                <span className="text-xs text-gray-400">· {timeAgo(rep.submittedAt || rep.date)}</span>
                                            </div>
                                            <h3 className="font-serif text-base font-bold text-gray-900 dark:text-white line-clamp-1">{rep.title}</h3>
                                            <p className="text-xs text-gray-600 dark:text-gray-300 line-clamp-2">{rep.content}</p>
                                            <div className="text-xs text-gray-500 dark:text-gray-400 pt-1">
                                                <span className="font-semibold text-gray-800 dark:text-gray-200">প্রেরক:</span> {rep.authorName} · <a href={`tel:${rep.authorPhone}`} className="text-emerald-600 dark:text-emerald-400 hover:underline">{rep.authorPhone}</a>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-2 shrink-0 pt-2 md:pt-0 border-t md:border-t-0 border-gray-100 dark:border-gray-700">
                                        <button
                                            onClick={() => openEdit(rep)}
                                            className="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 text-xs font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-1"
                                            title="সম্পাদনা ও বিস্তারিত"
                                        >
                                            <i className="ph ph-pencil-simple text-sm"></i> বিস্তারিত / এডিট
                                        </button>
                                        {rep.status === 'pending' && (
                                            <button
                                                onClick={() => handleApprove(rep.id)}
                                                className="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-bold hover:bg-blue-700 flex items-center gap-1"
                                                title="অনুমোদন করুন"
                                            >
                                                <i className="ph ph-check text-sm"></i> অনুমোদন
                                            </button>
                                        )}
                                        {rep.status !== 'published' && (
                                            <button
                                                onClick={() => { openEdit(rep); }}
                                                className="px-3 py-1.5 rounded-lg bg-[#E21D2B] text-white text-xs font-bold hover:bg-red-700 flex items-center gap-1"
                                                title="সংবাদ হিসেবে প্রকাশ করুন"
                                            >
                                                <i className="ph ph-broadcast text-sm"></i> প্রকাশ করুন
                                            </button>
                                        )}
                                        {rep.status !== 'rejected' && (
                                            <button
                                                onClick={() => handleReject(rep.id)}
                                                className="px-2.5 py-1.5 rounded-lg border border-red-200 text-red-600 dark:border-red-900/50 dark:text-red-400 text-xs font-bold hover:bg-red-50 dark:hover:bg-red-950/20"
                                                title="বাতিল করুন"
                                            >
                                                <i className="ph ph-x"></i>
                                            </button>
                                        )}
                                        <button
                                            onClick={() => handleDelete(rep.id)}
                                            className="px-2.5 py-1.5 rounded-lg border border-gray-200 text-gray-500 hover:text-red-600 dark:border-gray-700 dark:text-gray-400 dark:hover:text-red-400 text-xs"
                                            title="মুছে ফেলুন"
                                        >
                                            <i className="ph ph-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {activeReport && editForm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                            <div className="bg-white dark:bg-gray-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl border dark:border-gray-700 space-y-4">
                                <div className="flex items-center justify-between pb-3 border-b dark:border-gray-700">
                                    <div>
                                        <h3 className="font-serif text-lg font-bold text-gray-900 dark:text-white">প্রতিবেদন পর্যালোচনা ও প্রকাশনা</h3>
                                        <p className="text-xs text-gray-500">প্রেরক: {activeReport.authorName} ({activeReport.authorPhone})</p>
                                    </div>
                                    <button onClick={() => setActiveReport(null)} className="mc-icon-btn"><i className="ph ph-x"></i></button>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">সংবাদের শিরোনাম</label>
                                        <input
                                            type="text"
                                            value={editForm.title}
                                            onChange={(e) => setEditForm({ ...editForm, title: e.target.value })}
                                            className="w-full rounded-lg border border-gray-300 p-2.5 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white font-medium"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">প্রকাশের বিভাগ</label>
                                            <select
                                                value={editForm.categoryId}
                                                onChange={(e) => setEditForm({ ...editForm, categoryId: e.target.value })}
                                                className="w-full rounded-lg border border-gray-300 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                            >
                                                {MOCK_CATEGORIES.map(c => (
                                                    <option key={c.id} value={c.id}>{c.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">স্থান / ইউনিয়ন</label>
                                            <input
                                                type="text"
                                                value={editForm.location}
                                                onChange={(e) => setEditForm({ ...editForm, location: e.target.value })}
                                                className="w-full rounded-lg border border-gray-300 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">সংবাদের বিবরণ</label>
                                        <textarea
                                            rows="6"
                                            value={editForm.content}
                                            onChange={(e) => setEditForm({ ...editForm, content: e.target.value })}
                                            className="w-full rounded-lg border border-gray-300 p-2.5 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white leading-relaxed"
                                        ></textarea>
                                    </div>

                                    {activeReport.image && (
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">সংযুক্ত ছবি</label>
                                            <img src={activeReport.image} alt="Report attachment" className="h-44 w-auto rounded-lg object-cover border dark:border-gray-700" />
                                        </div>
                                    )}

                                    {activeReport.videoUrl && (
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">ভিডিও লিংক</label>
                                            <a href={activeReport.videoUrl} target="_blank" rel="noopener noreferrer" className="text-xs text-blue-600 dark:text-blue-400 underline break-all">
                                                {activeReport.videoUrl}
                                            </a>
                                        </div>
                                    )}
                                </div>

                                <div className="flex flex-wrap items-center justify-between gap-3 pt-4 border-t dark:border-gray-700">
                                    <button
                                        onClick={saveEdit}
                                        className="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-xs font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"
                                    >
                                        পরিবর্তন সংরক্ষণ
                                    </button>
                                    <div className="flex items-center gap-2">
                                        <button
                                            onClick={() => handleReject(activeReport.id)}
                                            className="px-3.5 py-2 rounded-lg border border-red-300 text-red-600 dark:border-red-800 dark:text-red-400 text-xs font-bold hover:bg-red-50 dark:hover:bg-red-950/20"
                                        >
                                            বাতিল করুন
                                        </button>
                                        <button
                                            onClick={() => handlePublish(activeReport)}
                                            className="px-5 py-2 rounded-lg bg-[#E21D2B] text-white text-xs font-bold hover:bg-red-700 shadow flex items-center gap-1.5"
                                        >
                                            <i className="ph-bold ph-broadcast"></i> সরাসরি সংবাদ হিসেবে প্রকাশ করুন
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const McAdminRouter = ({ rest }) => {
            const seg = String(rest || '').replace(/^\/+/, '').split('?')[0].split('/').filter(Boolean);
            const key = seg[0] || 'dashboard';
            const perm = MC_ADMIN_PERM[key];
            if (perm && !api.can(perm)) return <McAdminDenied name={key} />;
            if (!seg.length) return <McAdminDashboard />;
            if (seg[0] === 'news') {
                if (seg[1] === 'new') return <McAdminNewsEditor id="new" />;
                if (seg[1]) return <McAdminNewsEditor id={decodeURIComponent(seg[1])} />;
                return <McAdminNewsList />;
            }
            if (seg[0] === 'reports') return <McAdminReports />;
            if (seg[0] === 'categories') return <McAdminCategories />;
            if (seg[0] === 'tags') return <McAdminTags />;
            if (seg[0] === 'reporters') return <McAdminReporters />;
            if (seg[0] === 'comments') return <McAdminComments />;
            if (seg[0] === 'trash') return <McAdminTrash />;
            if (seg[0] === 'media') return <McAdminMedia />;
            if (seg[0] === 'videos') return <McAdminVideos />;
            if (seg[0] === 'announcements') return <McAdminAnnouncements />;
            if (seg[0] === 'albums') return <McAdminAlbums />;
            if (seg[0] === 'ads') return <McAdminAds />;
            if (seg[0] === 'pages') return <McAdminPages />;
            if (seg[0] === 'homepage') return <McAdminHomepage />;
            if (seg[0] === 'menus') return <McAdminMenus />;
            if (seg[0] === 'users') return <McAdminUsers />;
            if (seg[0] === 'newsletter') return <McAdminNewsletter />;
            if (seg[0] === 'security') return <McAdminSecurity />;
            if (seg[0] === 'activity') return <McAdminActivity />;
            if (seg[0] === 'analytics') return <McAdminAnalytics />;
            if (seg[0] === 'settings') return <McSettingsForm title="সাইট সেটিংস" desc="সাইটের নাম, ট্যাগলাইন, লোগো, যোগাযোগ, CTA ও ফুটার টেক্সট" bucket="settings" fields={[
                { key: 'siteName', label: 'সাইটের নাম' }, { key: 'sitePrefix', label: 'সাবনাম (দৈনিক/সপ্তাহিক)' },
                { key: 'tagline', label: 'ট্যাগলাইন' }, { key: 'domain', label: 'ডোমেইন' },
                { key: 'logo', label: 'লোগো URL', wide: true, preview: true },
                { key: 'fbUrl', label: 'ফেসবুক পেজ লিঙ্ক', wide: true }, { key: 'ytUrl', label: 'ইউটিউব লিঙ্ক', wide: true },
                { key: 'phone', label: 'ফোন' }, { key: 'email', label: 'ইমেইল' },
                { key: 'address', label: 'অফিসের ঠিকানা', wide: true },
                { key: 'footerText', label: 'ফুটার পরিচিতি', type: 'textarea', wide: true },
                { key: 'copyright', label: 'কপিরাইট লাইন', wide: true },
                { key: 'perPage', label: 'প্রতি পেজে সংবাদ', type: 'number' },
                { key: 'ctaText', label: 'নিউজ পেজের CTA লেখা', wide: true }, { key: 'ctaButtonText', label: 'CTA বাটনের লেখা' }, { key: 'ctaUrl', label: 'CTA লিঙ্ক', wide: true },
            ]} note="বর্তমান হেডার/ফুটার ডিজাইন অপরিবর্তিত রাখতে সাইটের নাম-লোগো এডিট শুধু অ্যাডমিন প্রিভিউতে প্রভাব ফেলে; Laravel-এ এগুলো site_settings টেবিল থেকে ব্লেড টেমপ্লেটে বসে।" />;
            if (seg[0] === 'seo') return <McSettingsForm title="SEO সেটিংস" desc="টাইটেল টেমপ্লেট, মেটা, ওপেন গ্রাফ, টুইটার কার্ড, canonical ও NewsArticle schema" bucket="seo" fields={[
                { key: 'siteTitle', label: 'ডিফল্ট টাইটেল ট্যাগ', wide: true },
                { key: 'metaDesc', label: 'ডিফল্ট মেটা বিবরণ', type: 'textarea', wide: true },
                { key: 'keywords', label: 'কীওয়ার্ড (কমা দিয়ে)' }, { key: 'twitterCard', label: 'Twitter card', type: 'select', options: ['summary', 'summary_large_image'] },
                { key: 'ogImage', label: 'ডিফল্ট OG ছবি URL', wide: true, preview: true },
                { key: 'canonical', label: 'Canonical (সাইটের মূল ঠিকানা)', wide: true },
                { key: 'robots', label: 'Robots ট্যাগ', type: 'select', options: ['index,follow', 'noindex,follow'] },
                { key: 'schema', label: 'NewsArticle JSON-Lড যুক্ত রাখুন', type: 'switch', on: 'সক্রিয়' },
            ]} note="প্রতিটি নিউজ পেজে স্বয়ংক্রিয় JSON-LD বসে (headline, datePublished, dateModified, author, publisher, image) — Google News/Discover-এর জন্য প্রয়োজনীয় ন্যূনতম তথ্য। sitemap.xml ও robots.txt ব্যাকএন্ডে জেনারেট হবে (docs/ দেখুন)।" />;
            return <McAdminDashboard />;
        };

        const App = () => {
            const { route } = React.useContext(AppContext);

            // অ্যাডমিন
            if (route.name === 'admin' || String(route.path).startsWith('/admin')) {
                return (
                    <AdminLayout>
                        <McAdminRouter rest={(route.params && route.params.rest) || String(route.path).replace(/^\/admin\/?/, '')} />
                        <McToasts />
                    </AdminLayout>
                );
            }

            // পাবলিক
            return (
                <PublicLayout>
                    <McPublicRouter route={route} />
                    <McLightbox />
                </PublicLayout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AppProvider>
                <App />
            </AppProvider>
        );
    </script>
</body>
</html>
